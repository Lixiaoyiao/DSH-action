# DSH 0.2.1-rc.2 stock-headless composition overlay.
# Same-repository trusted reviews may read/search the immutable API snapshot.
# The Docker boundary is still required because stock DSH does not confine reads.
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: never
    defaultPreset: read-only

- id: session-title-llm
