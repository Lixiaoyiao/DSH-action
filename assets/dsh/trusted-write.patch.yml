# DSH 0.2.1-rc.2 stock-headless composition overlay.
# The controller selects this only after same-repository and actor trust gates.
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: never
    defaultPreset: workspace-write

- id: session-title-llm
  disabled: true

- id: agent-instructions
  disabled: true

- id: skill
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

# File read/search/edit remain enabled. Shells are disabled so repository code
# cannot inspect the DSH process environment or reuse its ephemeral proxy token.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-goal
  disabled: true

- id: subagent
