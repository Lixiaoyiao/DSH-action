- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
- id: system-prompt
  config:
    personaPrefix: "Use observed repository evidence and report incomplete verification explicitly."
- id: dsh-action-policy
  config:
    allowedTools:
      - workspace.read
      - workspace.search
      - workspace.edit
      - native.web-search
      - native.web-fetch
    deniedTools: []
    rules: []
