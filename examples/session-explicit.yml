name: DSH explicit Session

on:
  workflow_dispatch:
    inputs:
      session_mode:
        description: Save a new task or resume its latest successful run
        type: choice
        default: save
        options:
          - save
          - resume
      source_run_id:
        description: For resume only, the latest successful run ID of this workflow
        type: string
        default: ""
      mode:
        description: Keep the same composition when resuming
        type: choice
        default: controlled
        options:
          - controlled
          - native
      prompt:
        description: Maintainer-authored task or follow-up instructions
        type: string
        default: Summarize this repository. If this Session already has a summary, refine it using the current repository context.

# Keep this literal at workflow level: all Session workflows in the repo share it.
concurrency:
  group: dsh-session
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  session:
    name: DSH Session
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pin the complete commit published in the v0.10.3 Release for production.
      # Commit this file to the default branch and dispatch from that branch.
      - uses: Lixiaoyiao/deepseek-harness-action@v0.10.3
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          command: task
          prompt: ${{ inputs.prompt }}
          dsh-mode: ${{ inputs.mode }}
          isolation: docker
          # The Action default image is already digest-pinned.
          session-mode: ${{ inputs.session_mode }}
          # Literal maintainer-selected key; choose a fresh key for a new task.
          session-key: repository-summary
          session-source-run-id: ${{ inputs.source_run_id }}
          session-retention-days: "3"
