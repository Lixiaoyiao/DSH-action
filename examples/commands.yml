# Copy this file to .github/workflows/dsh-commands.yml. Replace the Action tag
# below with its full release commit SHA before production use.
name: DSH commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  checks: read
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: dsh-command-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  command:
    if: contains(github.event.comment.body || github.event.review.body || '', '@dsh')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # issue_comment workflows run from the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: Lixiaoyiao/deepseek-harness-action@v0.10.3
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          dsh-version: 0.2.1-rc.2
          permission-profile: standard
          allow-write: "true"
          run-tests: "true"
          validation-integrity: strict
          # REQUIRED: Replace this fail-closed placeholder with your repository's
          # own credential-free validation argv. No package manager is assumed.
          test-commands: >-
            [["node","-e","console.error('REQUIRED: replace test-commands with your repository validation commands');process.exit(1)"]]
          # Replace this digest-pinned image too if validation needs another toolchain.
          container-image: docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
