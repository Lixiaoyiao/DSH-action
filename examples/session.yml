name: DSH automatic Session
run-name: dsh-session-${{ inputs.session_key }}

on:
  workflow_dispatch:
    inputs:
      session_key:
        description: Reuse this key to continue the task; use a fresh key to start another Session
        required: true
        type: string
        default: repository-summary
      mode:
        description: Keep the same composition when resuming
        type: choice
        default: controlled
        options:
          - controlled
          - native
      prompt:
        description: Maintainer-authored task or follow-up instructions
        type: string
        default: Summarize this repository. If this Session already has a summary, refine it using the current repository context.

# Keep the same key expression in run-name, concurrency and the Action input.
concurrency:
  group: dsh-session-${{ inputs.session_key }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  session:
    name: DSH Session
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pin the complete commit published in the v0.10.3 Release for production.
      # Commit this file to the default branch and dispatch from that branch.
      - uses: Lixiaoyiao/deepseek-harness-action@v0.10.3
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          command: task
          prompt: ${{ inputs.prompt }}
          dsh-mode: ${{ inputs.mode }}
          isolation: docker
          # The Action default image is already digest-pinned.
          session-mode: auto
          session-key: ${{ inputs.session_key }}
          session-retention-days: "3"
