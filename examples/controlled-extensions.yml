# Custom controlled-extension template. The package and endpoint names are
# intentionally non-routable placeholders: replace them with extensions you have
# audited. Pin this Action to its full release commit SHA in production.
name: DSH controlled MCP and Profile

on:
  workflow_dispatch:
    inputs:
      task:
        description: Trusted read-only task for the configured extensions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-controlled-extensions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - uses: Lixiaoyiao/deepseek-harness-action@v0.10.3
        id: dsh
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          command: task
          prompt: ${{ inputs.task }}
          task-access: read
          allow-write: "false"
          permission-profile: custom
          dsh-version: 0.2.1-rc.2
          isolation: docker
          container-image: docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059

          # Configuration does not grant a tool. Each canonical ID must also be
          # listed here, and the effective Controller policy must permit every
          # declared read/workspace-write/network capability.
          allowed-tools: >-
            [
              "workspace.read",
              "workspace.search",
              "mcp.knowledge.search",
              "plugin.repo-audit.scan"
            ]
          # Exact denies always win, including over future preset changes.
          disallowed-tools: >-
            ["workspace.edit","native.bash","native.web-search","native.subagent"]

          # Official @deepseek-ai/dsh-mcp-client transport. Streamable HTTP
          # always requires network on both the server and every exposed tool.
          # An extension-specific token may be supplied, but never pass
          # GITHUB_TOKEN or DEEPSEEK_API_KEY to an MCP server.
          mcp-config: |
            {
              "schemaVersion": 1,
              "servers": [{
                "id": "knowledge",
                "transport": "streamable-http",
                "url": "https://mcp.example.invalid/mcp",
                "headers": {
                  "Authorization": "Bearer ${{ secrets.READ_ONLY_MCP_TOKEN }}"
                },
                "network": true,
                "maxCalls": 8,
                "reconnect": {
                  "enabled": true,
                  "initialDelayMs": 500,
                  "maxDelayMs": 5000,
                  "maxAttempts": 3
                },
                "tools": [{
                  "id": "search",
                  "name": "search",
                  "description": "Search the approved read-only knowledge service",
                  "permissions": ["read", "network"],
                  "timeoutMs": 15000,
                  "maxOutputBytes": 65536,
                  "maxCalls": 4
                }]
              }]
            }

          # The Controller writes a DSH Profile manifest and Cordis patch. The
          # Bundle source is an exact top-level pin and its runtime tool name is
          # namespaced. Replace this illustrative package before running.
          # Installation/startup is trusted code execution, so it has a second
          # explicit gate in addition to allowed-tools.
          allow-plugin-install: "true"
          plugin-config: |
            {
              "schemaVersion": 1,
              "bundles": [{
                "id": "repo-audit",
                "package": "@example/dsh-repository-audit-bundle",
                "source": "1.2.3",
                "network": true,
                "tools": [{
                  "id": "scan",
                  "name": "plugin__repo-audit__scan",
                  "description": "Run the audited repository scan against its approved advisory feed",
                  "permissions": ["read", "network"],
                  "timeoutMs": 30000,
                  "maxOutputBytes": 131072,
                  "maxCalls": 2
                }]
              }],
              "plugins": []
            }

      - name: Inspect extension audit outputs
        if: ${{ always() }}
        env:
          DSH_PROFILE_DIGEST: ${{ steps.dsh.outputs['extension-profile-digest'] }}
          DSH_TOOL_RECEIPTS: ${{ steps.dsh.outputs['tool-receipts'] }}
        run: |
          printf 'profile=%s\n' "$DSH_PROFILE_DIGEST"
          printf '%s\n' "$DSH_TOOL_RECEIPTS" | jq .

# For stdio MCP, replace the server object with transport: "stdio", an audited
# executable already built into the digest-pinned image, fixed args, optional
# repository-relative cwd, explicit env, and network: false/true matching every
# tool. Shells, package managers, Git and dynamic runners such as npx are denied.
