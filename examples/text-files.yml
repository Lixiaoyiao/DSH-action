name: DSH text task

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Maintainer-selected DSH composition
        type: choice
        default: controlled
        options:
          - controlled
          - native

permissions:
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      # First commit the two referenced files to your default branch.
      # Keep these paths maintainer-authored; never interpolate PR/Issue/log data.
      - uses: Lixiaoyiao/deepseek-harness-action@v0.10.3
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          command: task
          dsh-mode: ${{ inputs.mode }}
          isolation: docker
          prompt-file: examples/prompts/repository-summary.md
          context-files: '["examples/context/release-checklist.txt"]'
