# Generated by create-deepseek-harness-action.
# Commit to the default branch and dispatch there. Keep the key bindings aligned.
name: DSH automatic Session
run-name: dsh-session-${{ inputs.session_key }}

on:
  workflow_dispatch:
    inputs:
      session_key:
        description: Lowercase key for this logical task; reuse it for a new follow-up
        type: string
        required: true
        default: repository-summary
      prompt:
        description: New task or follow-up instructions
        type: string
        required: true
        default: Summarize this repository.

permissions:
  contents: read
  actions: read

concurrency:
  group: dsh-session-${{ inputs.session_key }}
  cancel-in-progress: false
  queue: max

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: Lixiaoyiao/deepseek-harness-action@__DSH_ACTION_RELEASE_SHA__
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          # __DSH_MODE_INPUT__
          dsh-version: 0.2.1-rc.2
          command: task
          prompt: ${{ inputs.prompt }}
          permission-profile: strict
          isolation: docker
          allow-write: "false"
          progress-comment: "false"
          session-mode: auto
          session-key: ${{ inputs.session_key }}
          session-retention-days: "3"
