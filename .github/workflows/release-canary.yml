name: v0.10.3 release canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 3"

permissions:
  contents: read

concurrency:
  group: dsh-release-canary
  cancel-in-progress: false

jobs:
  gate:
    name: Bind canary to the live default branch
    if: github.repository == 'Lixiaoyiao/deepseek-harness-action'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate trusted workflow identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha_pattern='^[a-f0-9]{40}$'
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || {
            echo "The release canary must run from refs/heads/main" >&2
            exit 1
          }
          [[ "$WORKFLOW_SHA" =~ $sha_pattern && "$RUN_SHA" =~ $sha_pattern ]] || {
            echo "The workflow and run SHAs must be full lowercase commit SHAs" >&2
            exit 1
          }
          [[ "$RUN_SHA" == "$WORKFLOW_SHA" ]] || {
            echo "The canary run SHA must equal its immutable workflow SHA" >&2
            exit 1
          }

          repository_json="$(gh api "repos/$REPOSITORY")"
          [[ "$(jq -r .default_branch <<<"$repository_json")" == "main" ]] || {
            echo "The trusted canary branch must remain the repository default branch" >&2
            exit 1
          }
          live_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$live_sha" =~ $sha_pattern ]] || {
            echo "The live main ref must resolve to a full lowercase commit SHA" >&2
            exit 1
          }
          [[ "$RUN_SHA" == "$live_sha" ]] || {
            echo "The canary run SHA must equal the live main SHA" >&2
            exit 1
          }

  smoke:
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    environment: core-e2e
    timeout-minutes: 35
    env:
      RELEASE_TAG: v0.10.3
      RELEASE_SHA: ${{ vars.DSH_RELEASE_CANARY_SHA }}
    steps:
      - name: Validate protected canary secret
        env:
          DEEPSEEK_SECRET_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: test "$DEEPSEEK_SECRET_PRESENT" = true

      - name: Validate formal release and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Set repository variable DSH_RELEASE_CANARY_SHA to the full $RELEASE_TAG release commit SHA." >&2
            exit 1
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag and .draft == false and .prerelease == false
          ' <<<"$release_json" >/dev/null

          # A formal Release is bound through tag_name. Resolve lightweight or
          # annotated tags to the canonical commit before trusting the canary SHA.
          ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          for _ in 1 2 3 4 5; do
            [[ "$object_type" != "tag" ]] && break
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_sha="$(jq -r '.object.sha' <<<"$tag_json")"
            object_type="$(jq -r '.object.type' <<<"$tag_json")"
          done
          if [[ "$object_type" != "commit" || "$object_sha" != "$RELEASE_SHA" ]]; then
            echo "Formal release $RELEASE_TAG resolves to $object_type $object_sha, expected commit $RELEASE_SHA." >&2
            exit 1
          fi

      - name: Checkout the fixed release action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lixiaoyiao/deepseek-harness-action
          ref: ${{ env.RELEASE_SHA }}
          path: release-action
          persist-credentials: false
          fetch-depth: 1

      - name: Confirm checked out release commit and credential isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C release-action rev-parse HEAD)" = "$RELEASE_SHA"
          credential_config="$(
            git -C release-action config --local --get-regexp \
              '^(http\..*\.extraheader|credential\..*|credential\.helper)$' || true
          )"
          if [[ -n "$credential_config" ]]; then
            echo "The release checkout must not retain local Git credentials." >&2
            exit 1
          fi

      - name: Controlled default strict read-only smoke
        id: controlled
        continue-on-error: true
        uses: ./release-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          command: task
          prompt-file: examples/prompts/repository-summary.md
          context-files: '["examples/context/release-checklist.txt"]'
          task-access: read
          allow-write: "false"
          permission-profile: strict
          allowed-tools: "[]"
          disallowed-tools: "[]"
          progress-comment: "false"
          max-turns: "2"
          timeout-minutes: "12"

      - name: Assert controlled schema composition and tool policy
        id: controlled_assert
        continue-on-error: true
        env:
          DSH_RESULT_JSON: ${{ steps.controlled.outputs['result-json'] }}
          DSH_MODE: ${{ steps.controlled.outputs['dsh-mode'] }}
          DSH_COMPOSITION: ${{ steps.controlled.outputs['dsh-composition'] }}
          DSH_PERMISSION_PROFILE: ${{ steps.controlled.outputs['permission-profile'] }}
          DSH_EFFECTIVE_TOOLS: ${{ steps.controlled.outputs['effective-tools'] }}
          DSH_NETWORK_ACCESS: ${{ steps.controlled.outputs['network-access'] }}
          DSH_WORKSPACE_WRITE: ${{ steps.controlled.outputs['workspace-write'] }}
        run: |
          set -euo pipefail
          test "$DSH_MODE" = controlled
          test "$DSH_COMPOSITION" = github-action-controlled
          test "$DSH_PERMISSION_PROFILE" = strict
          test "$DSH_NETWORK_ACCESS" = host-gateway
          test "$DSH_WORKSPACE_WRITE" = false
          jq -e 'type == "array"' <<<"$DSH_EFFECTIVE_TOOLS" >/dev/null
          jq -e --argjson effectiveTools "$DSH_EFFECTIVE_TOOLS" '
            .schemaVersion == 1 and
            .conclusion == "success" and
            .operation == "task" and
            .textSources.instruction.path == "examples/prompts/repository-summary.md" and
            (.textSources.contexts | length == 1) and
            .githubRequests.clientRole == "main-controller" and
            .githubRequests.cacheHits > 0 and
            .dsh.mode == "controlled" and
            .dsh.composition == "github-action-controlled" and
            .permissions.profile == "strict" and
            .permissions.workspaceWrite == false and
            .permissions.effectiveTools == ["workspace.read","workspace.search"] and
            .permissions.effectiveTools == $effectiveTools and
            .toolPolicy.schemaVersion == 1 and
            .toolPolicy.policyOwner == "controller" and
            .toolPolicy.effectiveTools == $effectiveTools and
            (.toolPolicy | has("requestedTools")) and
            (.toolPolicy | has("deniedTools")) and
            (.toolPolicy | has("observedTools") | not)
          ' <<<"$DSH_RESULT_JSON" >/dev/null

      - name: Native read-only smoke
        id: native
        continue-on-error: true
        uses: ./release-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          dsh-mode: native
          command: task
          prompt-file: examples/prompts/repository-summary.md
          context-files: '["examples/context/release-checklist.txt"]'
          task-access: read
          allow-write: "false"
          permission-profile: strict
          progress-comment: "false"
          max-turns: "2"
          timeout-minutes: "12"

      - name: Assert native schema composition and observed tool policy
        id: native_assert
        continue-on-error: true
        env:
          DSH_RESULT_JSON: ${{ steps.native.outputs['result-json'] }}
          DSH_MODE: ${{ steps.native.outputs['dsh-mode'] }}
          DSH_COMPOSITION: ${{ steps.native.outputs['dsh-composition'] }}
          DSH_WORKSPACE_WRITE: ${{ steps.native.outputs['workspace-write'] }}
        run: |
          set -euo pipefail
          test "$DSH_MODE" = native
          test "$DSH_COMPOSITION" = dsh-native-headless
          test "$DSH_WORKSPACE_WRITE" = false
          jq -e '
            .schemaVersion == 1 and
            .conclusion == "success" and
            .operation == "task" and
            .dsh.mode == "native" and
            .textSources.instruction.path == "examples/prompts/repository-summary.md" and
            (.textSources.contexts | length == 1) and
            .githubRequests.clientRole == "main-controller" and
            .githubRequests.cacheHits > 0 and
            .dsh.composition == "dsh-native-headless" and
            .policy.trust == "trusted-read" and
            .permissions.profile == "strict" and
            .permissions.workspaceWrite == false and
            .isolation.backend == "docker" and
            .isolation.workspaceAccess == "read-only" and
            .toolPolicy.schemaVersion == 1 and
            .toolPolicy.policyOwner == "dsh" and
            (.toolPolicy.observedTools | length > 0) and
            (.toolPolicy.observedTools | index("read") != null) and
            (.toolPolicy | has("effectiveTools") | not) and
            (.toolPolicy | has("requestedTools") | not) and
            (.toolPolicy | has("deniedTools") | not)
          ' <<<"$DSH_RESULT_JSON" >/dev/null

      - name: Record diagnostics and require both release modes
        if: always()
        env:
          CONTROLLED_OUTCOME: ${{ steps.controlled.outcome }}
          CONTROLLED_ASSERTION: ${{ steps.controlled_assert.outcome }}
          CONTROLLED_ERROR_CODE: ${{ steps.controlled.outputs['error-code'] }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          NATIVE_ASSERTION: ${{ steps.native_assert.outcome }}
          NATIVE_ERROR_CODE: ${{ steps.native.outputs['error-code'] }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          // Keep diagnostics independent of model-authored summary/result bytes.
          // continue-on-error preserves the second mode's evidence, never the gate.
          const outcome = (value) => ["success", "failure", "cancelled", "skipped"].includes(value)
            ? value : "not-run";
          const errorCode = (value) => !value ? "none"
            : /^[A-Z][A-Z0-9_]{0,79}$/.test(value) ? value : "invalid-code";
          const results = ["controlled", "native"].map((mode) => {
            const prefix = mode.toUpperCase();
            return {
              mode,
              action: outcome(process.env[`${prefix}_OUTCOME`]),
              assertion: outcome(process.env[`${prefix}_ASSERTION`]),
              errorCode: errorCode(process.env[`${prefix}_ERROR_CODE`]),
            };
          });
          for (const result of results) console.log(JSON.stringify(result));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "### Release canary diagnostics\n\n" +
            "| Mode | Action | Schema / policy assertion | Error code |\n" +
            "| --- | --- | --- | --- |\n" +
            results.map((result) =>
              `| ${result.mode} | ${result.action} | ${result.assertion} | ${result.errorCode} |`
            ).join("\n") + "\n");
          if (results.some((result) => result.action !== "success" || result.assertion !== "success")) {
            console.error("Both release modes and all schema/policy assertions must succeed; see the independent diagnostics above.");
            process.exitCode = 1;
          }
          NODE
