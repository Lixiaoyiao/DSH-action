name: Automatic Session E2E
run-name: dsh-session-${{ inputs.session_key }}

on:
  workflow_dispatch:
    inputs:
      candidate_mode:
        description: Qualification target
        required: true
        default: pull-request
        type: choice
        options:
          - pull-request
          - main
      candidate_sha:
        description: Exact approved candidate Action SHA
        required: true
        type: string
      pull_request:
        description: Open same-repository PR; omit for main mode
        required: false
        type: number
      phase:
        description: Prove a first task, a follow-up, or automatically detect the expected phase
        required: true
        default: auto
        type: choice
        options:
          - auto
          - save
          - resume
      session_key:
        description: Maintainer-selected logical key; repeated runs automatically continue its Session
        required: true
        type: string
      image_attachment:
        description: Read one repository PNG on save and restore its official attachment on resume
        default: false
        type: boolean
      dsh_mode:
        description: Keep the same runtime composition for the pair
        required: true
        default: controlled
        type: choice
        options:
          - controlled
          - native
      hold_seconds:
        description: Optional 0-60 second hold for proving same-key serialization and different-key overlap
        default: 0
        type: number
      force_failure:
        description: Deliberately fail after a verified checkpoint to seed a failed-history boundary
        default: false
        type: boolean
      expected_failure:
        description: Explicit failure boundary to verify through the real Action before any worker task
        default: none
        type: choice
        options:
          - none
          - failed
          - expired
          - missing
          - corrupt
          - unknown
          - incompatible
      fixture_kind:
        description: After a verified first task, create a diagnostic artifact using only this run's SDK scope
        default: none
        type: choice
        options:
          - none
          - corrupt
          - orphan
          - expired
      fixture_target_key:
        description: Fresh distinct target key for the orphan diagnostic; otherwise leave empty
        default: ""
        type: string
      fixture_source_run_id:
        description: Oracle-only source run for independently verifying orphan provenance or actual manifest expiry
        default: 0
        type: number

permissions: {}

# A logical Session serializes across independent runs; other keys can execute together.
concurrency:
  group: dsh-session-${{ inputs.session_key }}
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    name: Bind candidate to PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_e2e: ${{ steps.bind.outputs.run_e2e }}
      candidate_mode: ${{ steps.bind.outputs.candidate_mode }}
      candidate_sha: ${{ steps.bind.outputs.candidate_sha }}
      candidate_branch: ${{ steps.bind.outputs.candidate_branch }}
      pull_request: ${{ steps.bind.outputs.pull_request }}
      harness_sha: ${{ steps.bind.outputs.harness_sha }}
    steps:
      - name: Checkout trusted admission harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable candidate identity
        id: bind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          CANDIDATE_MODE: ${{ inputs.candidate_mode }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}
          APPROVED_CANDIDATE_SHA: ${{ vars.DSH_E2E_CANDIDATE_SHA }}
        run: bash .github/e2e/assert-candidate-binding.sh admit

  session:
    # Exactly one static producer job/Action step, with no matrix or reusable job.
    needs: gate
    if: needs.gate.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    environment: core-e2e
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HARNESS_SHA: ${{ needs.gate.outputs.harness_sha }}
      CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
      PHASE: ${{ inputs.phase }}
      SESSION_KEY: ${{ inputs.session_key }}
      DSH_MODE: ${{ inputs.dsh_mode }}
      IMAGE_ATTACHMENT: ${{ inputs.image_attachment }}
      EXPECTED_FAILURE: ${{ inputs.expected_failure }}
      FIXTURE_KIND: ${{ inputs.fixture_kind }}
      FIXTURE_TARGET_KEY: ${{ inputs.fixture_target_key }}
      FIXTURE_SOURCE_RUN_ID: ${{ inputs.fixture_source_run_id }}
      FORCE_FAILURE: ${{ inputs.force_failure }}
    steps:
      - name: Checkout permanent harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          path: candidate-action
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Check immutable checkouts and Docker
        shell: bash
        env:
          DEEPSEEK_SECRET_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          set -euo pipefail
          [[ "$DEEPSEEK_SECRET_PRESENT" == "true" ]]
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]]
          [[ "$(git -C candidate-action rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          ! git config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          ! git -C candidate-action config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          docker version

      - name: Install immutable harness dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund

      - name: Install exact candidate dependencies without lifecycle scripts
        run: npm ci --prefix candidate-action --ignore-scripts --no-fund

      - name: Prepare hidden memory and current challenge outside the worker
        id: task
        run: node .github/e2e/session-auto-e2e-proof.mjs prepare

      - name: Hold the verified producer job for concurrency qualification
        shell: bash
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          set -euo pipefail
          [[ "$HOLD_SECONDS" =~ ^[0-9]+$ && "$HOLD_SECONDS" -le 60 ]]
          sleep "$HOLD_SECONDS"

      - name: Revalidate candidate immediately before execution
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
        run: bash .github/e2e/assert-candidate-binding.sh

      - name: Qualify a real GitHub upload with the candidate Controller
        if: inputs.image_attachment && steps.task.outputs.phase == 'save'
        run: node --experimental-strip-types .github/e2e/session-image-download.mjs

      - name: Execute one live official Session task
        id: action
        continue-on-error: true
        uses: ./candidate-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          command: task
          base-branch: ${{ inputs.image_attachment && 'codex/v0110-session-image-fixture' || '' }}
          task-access: ${{ steps.task.outputs.phase == 'save' && 'write' || 'read' }}
          allow-write: "true"
          dsh-mode: ${{ inputs.dsh_mode }}
          isolation: docker
          prompt: ${{ steps.task.outputs.prompt }}
          task-output-schema: ${{ steps.task.outputs.schema }}
          permission-profile: custom
          allowed-tools: '["workspace.read","workspace.search","workspace.edit"]'
          disallowed-tools: '["native.bash","native.subagent","native.web-search"]'
          progress-comment: "false"
          run-tests: "true"
          test-commands: '[["npm","ci","--ignore-scripts"],["npm","run","typecheck"],["npm","test"]]'
          max-turns: "1"
          timeout-minutes: "12"
          session-mode: auto
          session-key: ${{ inputs.session_key }}
          session-retention-days: "3"

      - name: Verify memory, new request, current permissions and raw checkpoint
        id: verify
        if: always() && steps.task.outcome == 'success'
        env:
          RESULT_JSON: ${{ steps.action.outputs['result-json'] }}
          ACTION_OUTCOME: ${{ steps.action.outcome }}
        run: node .github/e2e/session-auto-e2e-proof.mjs verify

      - name: Save safe qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-e2e/evidence/
          retention-days: 3
          if-no-files-found: error

      - name: Save successful pair proof outside the worker
        if: steps.verify.outcome == 'success' && inputs.expected_failure == 'none'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-e2e-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-e2e/proof/proof.json
          retention-days: 3
          if-no-files-found: error

      - name: Deliberately seed a failed producer history
        if: steps.verify.outcome == 'success' && inputs.force_failure
        run: exit 1
      - name: Create a current-run diagnostic Session history artifact
        id: fixture
        if: steps.verify.outcome == 'success' && inputs.expected_failure == 'none' && inputs.fixture_kind != 'none'
        uses: ./.github/e2e/session-history-fixture-action
        env:
          RESULT_JSON: ${{ steps.action.outputs['result-json'] }}
          ACTION_OUTCOME: ${{ steps.action.outcome }}

      - name: Preserve safe diagnostic artifact provenance
        if: steps.fixture.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-e2e-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-e2e/fixture/receipt.json
          retention-days: 3
          if-no-files-found: error
