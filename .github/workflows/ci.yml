name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          ! git config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Current-job artifact SDK transport smoke without a model
        uses: ./.github/e2e/session-history-fixture-action
        env:
          SESSION_FIXTURE_OPERATION: smoke
      - run: npm run check
      - name: Linux Docker frozen-SHA Validation Integrity regression
        id: integrity
        timeout-minutes: 10
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DSH_E2E_INTEGRITY_DOCKER: "1"
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git diff --exit-code "$CANDIDATE_SHA" -- \
            .github/workflows/ci.yml .github/e2e/integrity-llm.mjs \
            .github/e2e/messages-fixture.mjs \
            test/integrity-docker.integration.test.ts scripts/verify-dsh-config.mjs \
            src assets/dsh package.json package-lock.json
          ./node_modules/.bin/vitest run test/integrity-docker.integration.test.ts
      - name: Linux Docker frozen-SHA DSH rc.2 native ecosystem smoke
        # Collect the independent native evidence after a controlled failure;
        # the failed integrity step still fails this job and blocks release.
        if: ${{ !cancelled() && (success() || steps.integrity.outcome == 'failure') }}
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git diff --exit-code "$CANDIDATE_SHA" -- \
            .github/workflows/ci.yml assets/dsh package.json package-lock.json test/fixtures
          runtime_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          smoke_network="dsh-native-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          server_pid=""
          run_as="$(id -u):$(id -g)"
          cleanup() {
            if [[ "$server_pid" =~ ^[1-9][0-9]*$ ]]; then
              kill -TERM "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            docker network rm "$smoke_network" >/dev/null 2>&1 || true
            docker run --rm \
              --mount "type=bind,source=$runtime_dir,target=/runtime" \
              --mount "type=bind,source=$smoke_dir,target=/smoke" \
              docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059 \
              rm -rf -- \
                /runtime/node_modules /runtime/package.json /runtime/package-lock.json \
                /runtime/action-launcher.mjs /runtime/native-launcher.mjs \
                /runtime/native-mcp-server.mjs /runtime/native-mcp-fixture \
                /runtime/cordis.patch.yml \
                /runtime/action-native-root.yml /runtime/pnpm-workspace.yaml \
                /smoke/home /smoke/workspace /smoke/native.stdout \
                /smoke/native.stderr /smoke/endpoint.json /smoke/server.log \
                /smoke/native-requests.jsonl || true
            rmdir "$runtime_dir" "$smoke_dir" || true
          }
          trap cleanup EXIT
          cp package.json package-lock.json assets/dsh/action-launcher.mjs assets/dsh/native-launcher.mjs "$runtime_dir/"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$run_as" \
            --memory 4g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=536870912 \
            --mount "type=bind,source=$runtime_dir,target=/opt/dsh-action/package" \
            --workdir /opt/dsh-action/package \
            --env HOME=/tmp --env npm_config_cache=/tmp/npm-cache \
            --env NODE_OPTIONS=--max-old-space-size=3072 \
            docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059 \
            npm ci --strict-peer-deps --no-fund --omit=dev --ignore-scripts --loglevel=error
          docker run --rm -i --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$run_as" \
            --network none \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=536870912 \
            --mount "type=bind,source=$runtime_dir,target=/opt/dsh-action/package,readonly" \
            --mount "type=bind,source=$runtime_dir,target=/dsh-home/profiles/github-action,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/assets/dsh,target=/opt/dsh-action/assets,readonly" \
            --workdir /dsh-home/profiles/github-action \
            docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059 \
            node --input-type=module <<'NODE'
          import { spawnSync } from "node:child_process";
          import { readFile } from "node:fs/promises";

          // Reuse this exact installation and hardened container. The default
          // cache probe is diagnostic; direct loading from the immutable
          // package is a required compatibility gate, with no credentials.
          const nativeProbe = `
            import { createRequire } from "node:module";
            const require = createRequire(import.meta.url);
            const attempts = (error, depth = 0) => ({
              message: String(error?.message ?? "unknown native load failure").slice(0, 2048),
              ...(depth < 3 && Array.isArray(error?.attempts) ? {
                attempts: error.attempts.slice(0, 8).map((attempt) => ({
                  source: attempt.source, path: attempt.path, loadPath: attempt.loadPath,
                  backend: attempt.backend, abi: attempt.abi, ...attempts(attempt, depth + 1),
                })),
              } : {}),
            });
            try {
              const addon = require("node-addon-require-builtin");
              const info = addon.getBindingInfo();
              const internals = addon.requireBuiltin("internal/modules/esm/loader");
              if (typeof internals.getOrInitializeCascadedLoader !== "function") throw new Error("Node ESM internals unavailable");
              console.log(JSON.stringify({ ok: true, ...info }));
            } catch (error) {
              console.log(JSON.stringify({ ok: false, ...attempts(error) }));
              process.exitCode = 1;
            }
          `;
          const probe = (disableCache) => {
            const child = spawnSync(process.execPath, ["--expose-internals", "--input-type=module", "-e", nativeProbe], {
              cwd: process.cwd(), encoding: "utf8", timeout: 10000, maxBuffer: 65536,
              env: { PATH: process.env.PATH, HOME: "/tmp", ...(disableCache ? { NARB_DISABLE_NATIVE_CACHE: "1" } : {}) },
            });
            if (child.error || child.signal !== null || ![0, 1].includes(child.status)) throw new Error("Native binding probe did not complete");
            return { exitCode: child.status, ...JSON.parse(child.stdout) };
          };
          const defaultCache = probe(false);
          const immutablePackage = probe(true);
          const nativeAddonVersion = JSON.parse(await readFile("node_modules/node-addon-require-builtin/package.json", "utf8")).version;
          const defaultEvidence = JSON.stringify(defaultCache);
          const tmpMount = (await readFile("/proc/mounts", "utf8")).split("\n").find((line) => line.split(" ")[1] === "/tmp");
          if (!tmpMount?.split(" ")[3]?.split(",").includes("noexec")) throw new Error("Worker temporary filesystem must remain noexec");
          console.log(JSON.stringify({
            node: process.version, nodeAbi: process.versions.modules, nativeAddonVersion, tmpMount,
            defaultCacheFailureObserved: defaultCache.ok === false,
            cacheNoexecFailureObserved: defaultCache.ok === false && defaultEvidence.includes('"loadPath":"/tmp/') && /failed to map segment|permission denied|operation not permitted/iu.test(defaultEvidence),
            defaultCache, immutablePackage,
          }));
          if (!immutablePackage.ok || immutablePackage.exitCode !== 0 ||
              immutablePackage.bindingSource !== "optional-package" ||
              !immutablePackage.bindingPath.startsWith(process.cwd() + "/node_modules/")) {
            throw new Error("Pinned native binding must load directly from the read-only package");
          }

          const expectedVersion = "0.2.1-rc.2";
          const manifest = JSON.parse(await readFile("package.json", "utf8"));
          const lock = JSON.parse(await readFile("package-lock.json", "utf8"));
          const expectedPackages = Object.keys(manifest.dependencies ?? {})
            .filter(
              (packageName) =>
                packageName === "@deepseek-ai/dsh" || packageName.startsWith("@deepseek-ai/dsh-"),
            )
            .sort();
          if (expectedPackages.length === 0) {
            throw new Error("No direct DSH runtime packages were declared");
          }
          for (const packageName of expectedPackages) {
            if (manifest.dependencies?.[packageName] !== expectedVersion) {
              throw new Error(`${packageName} is not exactly pinned to ${expectedVersion}`);
            }
            const installed = JSON.parse(
              await readFile(`node_modules/${packageName}/package.json`, "utf8"),
            );
            if (installed.version !== expectedVersion) {
              throw new Error(`${packageName} installed ${installed.version}`);
            }
          }
          for (const [packagePath, entry] of Object.entries(lock.packages ?? {})) {
            if (
              /(?:^|\/)node_modules\/@deepseek-ai\/dsh(?:-[^/]+)?$/.test(packagePath) &&
              entry.version !== expectedVersion
            ) {
              throw new Error(`${packagePath} is locked to ${entry.version}`);
            }
          }

          const appBoot = await import("@deepseek-ai/dsh-app-boot");
          if (
            typeof appBoot.boot !== "function" ||
            typeof appBoot.loadProfile !== "function" ||
            typeof appBoot.createRuntimeResolution !== "function" ||
            typeof appBoot.PluginPackages !== "function" ||
            typeof appBoot.installFailLoud !== "function"
          ) {
            throw new Error("official dsh-app-boot exports are unavailable");
          }
          const mcp = await import("@deepseek-ai/dsh-mcp-client");
          if (mcp.name !== "mcp-client" || typeof mcp.apply !== "function") {
            throw new Error("official dsh-mcp-client exports are unavailable");
          }

          for (const asset of [
            "action-launcher.mjs",
            "action-policy.mjs",
            "action-workspace.mjs",
            "native-launcher.mjs",
          ]) {
            const assetPath = `/opt/dsh-action/assets/${asset}`;
            const syntax = spawnSync(process.execPath, ["--check", assetPath], {
              encoding: "utf8",
            });
            if (syntax.status !== 0) {
              throw new Error(`${asset} failed syntax validation: ${syntax.stderr}`);
            }
          }
          const launcher = await readFile(
            "/opt/dsh-action/assets/action-launcher.mjs",
            "utf8",
          );
          const packagedLauncher = await readFile(
            "/opt/dsh-action/package/action-launcher.mjs",
            "utf8",
          );
          if (packagedLauncher !== launcher) {
            throw new Error("controlled launcher was not copied into the locked package root");
          }
          for (const packageName of [
            "@deepseek-ai/dsh-app-boot",
            "@deepseek-ai/dsh-cmdline",
            "@deepseek-ai/dsh-launch-environment",
          ]) {
            if (!launcher.includes(packageName)) {
              throw new Error(`controlled launcher does not use ${packageName}`);
            }
          }
          process.stdout.write("locked DSH rc.2 app-boot/MCP runtime ok\n");
          NODE

          SMOKE_ROOT="$smoke_dir" RUNTIME_ROOT="$runtime_dir" \
            node test/fixtures/prepare-native-ecosystem-profile.mjs
          [[ ! -e "$smoke_dir/workspace/.git" ]]

          endpoint="$smoke_dir/endpoint.json"
          request_log="$smoke_dir/native-requests.jsonl"
          DSH_FIXTURE_HOST=0.0.0.0 DSH_NATIVE_REQUEST_LOG="$request_log" \
            node test/fixtures/native-ecosystem-llm-server.mjs \
            >"$endpoint" 2>"$smoke_dir/server.log" &
          server_pid=$!
          for _ in {1..60}; do
            [[ -s "$endpoint" ]] && break
            kill -0 "$server_pid" 2>/dev/null || { cat "$smoke_dir/server.log" >&2; exit 1; }
            sleep 1
          done
          [[ -s "$endpoint" ]]
          fixture_port="$(jq -r '.baseUrl | capture(":(?<port>[0-9]+)$").port' "$endpoint")"
          [[ "$fixture_port" =~ ^[1-9][0-9]*$ ]]

          docker network create --internal "$smoke_network" >/dev/null
          smoke_gateway="$(docker network inspect "$smoke_network" --format '{{(index .IPAM.Config 0).Gateway}}')"
          [[ -n "$smoke_gateway" ]]
          docker run --rm --init --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 256 --memory 2g --cpus 2 --user "$run_as" \
            --network "$smoke_network" --add-host "host.docker.internal:$smoke_gateway" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=536870912 \
            --mount "type=bind,source=$smoke_dir/workspace,target=/workspace,readonly" \
            --mount "type=bind,source=$smoke_dir/home,target=/dsh-home,readonly" \
            --mount "type=bind,source=$smoke_dir/home/action-state,target=/dsh-home/action-state" \
            --mount "type=bind,source=$smoke_dir/home/sessions,target=/dsh-home/sessions" \
            --mount "type=bind,source=$smoke_dir/home/attachments,target=/dsh-home/attachments" \
            --mount "type=bind,source=$smoke_dir/home/storages,target=/dsh-home/storages" \
            --mount "type=bind,source=$runtime_dir,target=/dsh-home/profiles/github-action,readonly" \
            --mount "type=bind,source=$runtime_dir,target=/opt/dsh-action/package,readonly" \
            --workdir /workspace \
            --env CI=true --env HOME=/dsh-home --env DSH_HOME=/dsh-home \
            --env DSH_PERMISSION_MODE=read-only --env DSH_TELEMETRY_DISABLED=1 \
            --env DSH_TOOLS_MODE=native --env DEEPSEEK_API_KEY=fixture-worker-token \
            --env NARB_DISABLE_NATIVE_CACHE=1 \
            --env "DEEPSEEK_BASE_URL=http://host.docker.internal:$fixture_port" \
            --env "DEEPSEEK_SEARCH_BASE_URL=http://host.docker.internal:$fixture_port" \
            docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059 \
            node --expose-internals /dsh-home/profiles/github-action/native-launcher.mjs \
            'Use the requested native ecosystem capabilities and return review JSON.' \
            >"$smoke_dir/native.stdout" 2>"$smoke_dir/native.stderr"

          node --input-type=module - "$smoke_dir/native.stderr" <<'NODE'
          import { readFile } from "node:fs/promises";
          const stderr = await readFile(process.argv[2], "utf8");
          const diagnostics = stderr.replace(
            /\(node:\d+\) ExperimentalWarning: stripTypeScriptTypes is an experimental feature and might change at any time\r?\n\(Use `node --trace-warnings \.\.\.` to show where the warning was created\)\r?\n/gu,
            "",
          );
          if (diagnostics !== "") throw new Error(`Unexpected native runtime diagnostic: ${diagnostics}`);
          NODE
          jq -s -e '
            .[0].type == "session" and
            ([.[] | select(.type == "session")] | length) == 1 and
            ([.[] | select(.type == "final")] | length) == 1 and
            all(.[]; .type != "error") and
            any(.[]; .type == "status" and .phase == "turn_end" and .reason.kind == "completed") and
            .[-1].type == "final" and
            (.[-1].text | fromjson |
              .protocolVersion == 1 and .operation == "review" and
              .state == "final" and .summary == "native ecosystem booted")
          ' "$smoke_dir/native.stdout" >/dev/null
          jq -s -e '
            length == 1 and .[0].schemaVersion == 1 and
            .[0].source == "ctx.tools.schemas(agent)" and
            (.[0] | has("effectiveTools") | not) and
            (.[0].observedTools | index("skill") != null) and
            (.[0].observedTools | index("subagent") != null) and
            (.[0].observedTools | index("workflow") != null) and
            (.[0].observedTools | index("mcp__fixture__add") != null) and
            (.[0].observedTools | index("native_bundle_echo") != null) and
            (.[0].observedTools | index("native_plugin_echo") != null) and
            (.[0].observedTools | index("web_fetch") != null) and
            (.[0].observedTools | index("list_mcp_resources") == null) and
            (.[0].observedTools | index("workspace.read") == null)
          ' "$smoke_dir/home/action-state/native-observed-tools.jsonl" >/dev/null
          jq -s -e '
            map(tostring) | join("\n") as $transcript |
            ($transcript | contains("native-dsh")) and
            ($transcript | contains("native-agents")) and
            ($transcript | contains("NATIVE_DSH_SKILL_BODY_MARKER")) and
            ($transcript | contains("NATIVE_AGENTS_SKILL_BODY_MARKER")) and
            ($transcript | contains("mcp__fixture__add")) and
            ($transcript | contains("42")) and
            ($transcript | contains("NATIVE_BUNDLE_MARKER")) and
            ($transcript | contains("NATIVE_PLUGIN_MARKER:CORDIS_NATIVE_CI")) and
            ($transcript | contains("CHILD_NATIVE_MARKER_OK")) and
            ($transcript | contains("NATIVE_WORKFLOW_MARKER"))
          ' "$request_log" >/dev/null
          echo "native frozen-SHA ecosystem Docker smoke ok"
