name: DSH commands

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dsh-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    if: github.event.sender.type != 'Bot' && !endsWith(github.event.sender.login, '[bot]') && contains(github.event.comment.body, '@dsh')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Load action code only from the immutable trusted workflow revision.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          allow-write: "true"
          # Separate opt-in for explicit natural-language change requests.
          natural-language-write: "false"
          run-tests: "true"
          test-commands: '[["npm","ci","--ignore-scripts"],["npm","test"],["npm","run","typecheck"]]'
          container-image: docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
