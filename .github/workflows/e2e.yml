name: Core E2E

on:
  workflow_dispatch:
    inputs:
      candidate_mode:
        description: "Qualification target: an open pull request head or the live main release commit"
        required: true
        default: pull-request
        type: choice
        options:
          - pull-request
          - main
      candidate_sha:
        description: Full lowercase SHA of the candidate action commit
        required: true
        type: string
      pull_request:
        description: Open same-repository PR whose head is candidate_sha; omit for main mode
        required: false
        type: number

permissions: {}

concurrency:
  group: dsh-core-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    name: Bind candidate to PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_e2e: ${{ steps.bind.outputs.run_e2e }}
      candidate_mode: ${{ steps.bind.outputs.candidate_mode }}
      candidate_sha: ${{ steps.bind.outputs.candidate_sha }}
      candidate_branch: ${{ steps.bind.outputs.candidate_branch }}
      pull_request: ${{ steps.bind.outputs.pull_request }}
      harness_sha: ${{ steps.bind.outputs.harness_sha }}
    steps:
      - name: Checkout trusted admission harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable candidate identity
        id: bind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          CANDIDATE_MODE: ${{ inputs.candidate_mode }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}
          APPROVED_CANDIDATE_SHA: ${{ vars.DSH_E2E_CANDIDATE_SHA }}
        run: bash .github/e2e/assert-candidate-binding.sh admit

  read_only:
    name: Read-only golden paths
    needs: gate
    if: needs.gate.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    environment: core-e2e
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout permanent harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          path: candidate-action
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare immutable local harness
        shell: bash
        env:
          HARNESS_SHA: ${{ needs.gate.outputs.harness_sha }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          DEEPSEEK_SECRET_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          set -euo pipefail
          [[ "$DEEPSEEK_SECRET_PRESENT" == "true" ]]
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]]
          [[ "$(git -C candidate-action rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          ! git -C . config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          ! git -C candidate-action config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          node --check .github/e2e/mcp-http-server.mjs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install fixture dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Fixtures stay bound to trusted main. Candidate tests must resolve their
      # own locked runtime instead of inheriting the harness runtime from main.
      - name: Install exact candidate test dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix candidate-action --ignore-scripts --no-fund
          npm ls --prefix candidate-action --all

      - name: Deterministic native ecosystem compatibility
        shell: bash
        run: |
          set -euo pipefail
          (
            cd candidate-action
            ./node_modules/.bin/vitest run test/native-ecosystem.integration.test.ts
          )

      - name: Strict Profile and official Bundle baseline
        id: strict
        uses: ./candidate-action
        with:
          # The bound candidate owns its exact runtime default. Do not override
          # it with the runtime version used by the trusted harness checkout.
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          command: task
          task-access: read
          prompt: Inspect README.md and return one concise sentence describing this action. Do not request unavailable tools.
          permission-profile: strict
          progress-comment: "false"
          max-controller-steps: "2"
          timeout-minutes: "12"

      - name: Assert strict/Profile/Bundle result
        shell: bash
        env:
          RESULT_JSON: ${{ steps.strict.outputs['result-json'] }}
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 2 and .termination.conclusion == "success" and .operation.kind == "task" and
            .context.policy.trust == "trusted-read" and .context.permission.profile == "strict" and
            .context.permission.effectiveTools == ["workspace.read","workspace.search"] and
            .context.toolPolicy.policyOwner == "controller" and
            .context.toolPolicy.requestedTools == ["workspace.edit","workspace.read","workspace.search"] and
            .context.toolPolicy.effectiveTools == .context.permission.effectiveTools and
            (.context.toolPolicy.deniedTools | any(.id == "workspace.edit")) and
            (.context.toolPolicy | has("observedTools") | not) and
            .context.permission.workspaceWrite == false and
            .agent.isolation.backend == "docker" and .agent.isolation.processIsolated == true and
            .agent.isolation.workspaceAccess == "read-only" and
            .agent.isolation.extensionProfile == "github-action" and
            (.agent.isolation.extensionDigest | test("^[a-f0-9]{64}$")) and
            .agent.extensionAudit.profile == "github-action" and
            (.agent.extensionAudit.digest | test("^[a-f0-9]{64}$"))
          ' <<<"$RESULT_JSON" >/dev/null

      - name: Native headless read-only smoke
        id: native
        uses: ./candidate-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          dsh-mode: native
          isolation: docker
          command: task
          task-access: read
          prompt: Inspect README.md with the DSH native tools and return one concise sentence describing this action. Do not change files.
          permission-profile: strict
          progress-comment: "false"
          max-controller-steps: "2"
          timeout-minutes: "12"

      - name: Assert native composition and observed inventory
        shell: bash
        env:
          RESULT_JSON: ${{ steps.native.outputs['result-json'] }}
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 2 and .termination.conclusion == "success" and .operation.kind == "task" and
            .context.dsh.mode == "native" and .context.dsh.composition == "dsh-native-headless" and
            .context.policy.trust == "trusted-read" and
            .context.toolPolicy.policyOwner == "dsh" and
            (.context.toolPolicy.observedTools | length > 0) and
            (.context.toolPolicy.observedTools | index("read") != null) and
            (.context.toolPolicy.observedTools | index("glob") != null) and
            (.context.toolPolicy.observedTools | index("grep") != null) and
            (.context.toolPolicy.observedTools | index("workspace.read") == null) and
            (.context.toolPolicy.observedTools | index("workspace.search") == null) and
            (.context.toolPolicy | has("effectiveTools") | not) and
            (.context.toolPolicy | has("requestedTools") | not) and
            (.context.toolPolicy | has("deniedTools") | not) and
            .context.permission.workspaceWrite == false and
            .context.permission.network == "mediated-web" and
            .agent.isolation.backend == "docker" and .agent.isolation.processIsolated == true and
            .agent.isolation.workspaceAccess == "read-only" and
            .agent.isolation.extensionProfile == "none" and
            (.agent.isolation | has("extensionDigest") | not) and
            (.agent | has("extensionAudit") | not)
          ' <<<"$RESULT_JSON" >/dev/null

      - name: Start real Streamable HTTP MCP fixture
        id: mcp_server
        shell: bash
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/dsh-e2e-mcp-audit.jsonl"
          endpoint="$RUNNER_TEMP/dsh-e2e-mcp-endpoint.json"
          : > "$audit"
          DSH_E2E_MCP_AUDIT="$audit" node .github/e2e/mcp-http-server.mjs > "$endpoint" 2> "$RUNNER_TEMP/dsh-e2e-mcp.log" &
          pid=$!
          for _ in {1..60}; do
            if [[ -s "$endpoint" ]] && curl --fail --silent "$(jq -r .healthUrl "$endpoint")" >/dev/null; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/dsh-e2e-mcp.log" >&2; exit 1; }
            sleep 1
          done
          curl --fail --silent "$(jq -r .healthUrl "$endpoint")" >/dev/null
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
          echo "audit=$audit" >> "$GITHUB_OUTPUT"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          proof="$(jq -r .expectedProof "$endpoint")"
          [[ "$proof" =~ ^[0-9a-f]{48}$ ]]
          echo "::add-mask::$proof"
          echo "worker_url=$(jq -r .workerUrl "$endpoint")" >> "$GITHUB_OUTPUT"

      - name: MCP allow and deny
        id: mcp
        uses: ./candidate-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          command: task
          task-access: read
          prompt: Call the available MCP echo tool exactly once with marker rc2-mcp-allow. Its response contains an opaque proof that is unavailable before the call. Copy the actual returned proof into taskOutput.proof. Never call hidden or any other tool, and do not invent the proof.
          task-output-schema: '{"type":"object","properties":{"proof":{"type":"string","minLength":48,"maxLength":48}},"required":["proof"],"additionalProperties":false}'
          permission-profile: custom
          allowed-tools: '["workspace.read","workspace.search","mcp.fixture.echo","mcp.fixture.hidden"]'
          disallowed-tools: '["mcp.fixture.hidden"]'
          mcp-config: >-
            {"schemaVersion":1,"servers":[{"id":"fixture","transport":"streamable-http","url":"${{ steps.mcp_server.outputs.worker_url }}","headers":{},"network":true,"maxCalls":2,"reconnect":{"enabled":false,"initialDelayMs":500,"maxDelayMs":1000,"maxAttempts":1},"tools":[{"id":"echo","name":"echo","description":"Return the supplied E2E marker.","permissions":["read","network"],"timeoutMs":15000,"maxOutputBytes":16384,"maxCalls":1},{"id":"hidden","name":"hidden","description":"Denied control tool.","permissions":["read","network"],"timeoutMs":15000,"maxOutputBytes":16384,"maxCalls":1}]}]}
          progress-comment: "false"
          max-controller-steps: "2"
          timeout-minutes: "12"

      - name: Assert MCP allow/deny and receipts
        if: always()
        shell: bash
        env:
          RESULT_JSON: ${{ steps.mcp.outputs['result-json'] }}
          MCP_AUDIT: ${{ steps.mcp_server.outputs.audit }}
          MCP_ENDPOINT: ${{ steps.mcp_server.outputs.endpoint }}
          MCP_EVIDENCE: ${{ runner.temp }}/dsh-e2e-mcp-evidence.json
          MCP_ACTION_OUTCOME: ${{ steps.mcp.outcome }}
        run: |
          set -euo pipefail
          node .github/e2e/mcp-proof-evidence.mjs capture
          jq -e '.actionOutcome == "success" and .proofMatches == true' "$MCP_EVIDENCE" >/dev/null
          jq -e '
            .termination.conclusion == "success" and .context.permission.profile == "custom" and
            .context.permission.effectiveTools == ["mcp.fixture.echo","workspace.read","workspace.search"] and
            .context.toolPolicy.policyOwner == "controller" and
            .context.toolPolicy.requestedTools == ["mcp.fixture.echo","mcp.fixture.hidden","workspace.read","workspace.search"] and
            .context.toolPolicy.effectiveTools == .context.permission.effectiveTools and
            (.context.toolPolicy.deniedTools | any(.id == "mcp.fixture.hidden")) and
            (.context.toolPolicy | has("observedTools") | not) and
            .context.permission.network == "bridge" and
            (.context.permission.deniedTools | any(.id == "mcp.fixture.hidden")) and
            (.context.permission.trustedExtensions | any(.id == "fixture" and .kind == "mcp" and .network == true)) and
            (.agent.dshToolReceipts // [] | map(select(.id == "mcp.fixture.echo" and .provider == "mcp" and .completed == true and .ok == true)) | length == 1) and
            (.agent.dshToolReceipts // [] | all(.id != "mcp.fixture.hidden"))
          ' <<<"$RESULT_JSON" >/dev/null
          [[ "$(wc -l < "$MCP_AUDIT")" -eq 1 ]]
          jq -e '.tool == "echo" and .input.marker == "rc2-mcp-allow"' "$MCP_AUDIT" >/dev/null
          ! grep -q 'hidden' "$MCP_AUDIT"

      - name: Stop MCP fixture
        if: always()
        shell: bash
        env:
          MCP_PID: ${{ steps.mcp_server.outputs.pid }}
        run: |
          if [[ "$MCP_PID" =~ ^[1-9][0-9]*$ ]]; then
            kill -TERM "$MCP_PID" 2>/dev/null || true
            wait "$MCP_PID" 2>/dev/null || true
          fi

      - name: Report bounded MCP proof diagnostics
        if: always()
        shell: bash
        env:
          MCP_EVIDENCE: ${{ runner.temp }}/dsh-e2e-mcp-evidence.json
          MCP_ACTION_OUTCOME: ${{ steps.mcp.outcome }}
          RESULT_JSON: ${{ steps.mcp.outputs['result-json'] }}
        run: node .github/e2e/mcp-proof-evidence.mjs report

      - name: Preserve MCP execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-execution-evidence
          path: |
            ${{ runner.temp }}/dsh-e2e-mcp-evidence.json
            ${{ runner.temp }}/dsh-e2e-mcp-audit.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Real mediated Web Search
        id: web
        uses: ./candidate-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          command: task
          task-access: read
          prompt: Call the actual DSH runtime web_search tool exactly once with one query, "site:api-docs.deepseek.com context caching". Copy the first source returned by that tool into taskOutput, using its displayed title as title and its absolute URL as url. Do not answer from repository context or memory, and do not invent a source. If the tool returns no source, report blocked. Call no other tool.
          task-output-schema: '{"type":"object","properties":{"title":{"type":"string","minLength":1,"maxLength":512},"url":{"type":"string","format":"uri","minLength":1,"maxLength":2048}},"required":["title","url"],"additionalProperties":false}'
          permission-profile: custom
          allowed-tools: '["native.web-search"]'
          progress-comment: "false"
          max-controller-steps: "2"
          timeout-minutes: "12"

      - name: Assert Web Search mediation and receipt
        if: always()
        shell: bash
        env:
          RESULT_JSON: ${{ steps.web.outputs['result-json'] }}
          WEB_ACTION_OUTCOME: ${{ steps.web.outcome }}
          WEB_EVIDENCE: ${{ runner.temp }}/dsh-e2e-web-evidence.json
        run: |
          set -euo pipefail
          node .github/e2e/web-search-evidence.mjs
          jq -e '
            .actionOutcome == "success" and .sourceReported == true and
            .receiptCount == 1 and .completedWebSearchCount == 1
          ' "$WEB_EVIDENCE" >/dev/null
          jq -e '
            .termination.conclusion == "success" and
            .context.permission.effectiveTools == ["native.web-search"] and
            .context.permission.network == "mediated-web" and
            (.agent.dshToolReceipts // [] | map(select(.id == "native.web-search" and .completed == true and .ok == true)) | length == 1)
          ' <<<"$RESULT_JSON" >/dev/null

      - name: Preserve bounded Web Search evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-search-execution-evidence
          path: ${{ runner.temp }}/dsh-e2e-web-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Revalidate candidate identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
        run: |
          set -euo pipefail
          bash .github/e2e/assert-candidate-binding.sh

  write:
    name: Write guards and golden paths
    needs: gate
    if: needs.gate.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    environment: core-e2e
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout permanent harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          path: candidate-action
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Prepare write mutation baseline
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HARNESS_SHA: ${{ needs.gate.outputs.harness_sha }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
          DEEPSEEK_SECRET_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          set -euo pipefail
          [[ "$DEEPSEEK_SECRET_PRESENT" == "true" ]]
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]]
          [[ "$(git -C candidate-action rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          ! git -C . config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          ! git -C candidate-action config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          cat > "$RUNNER_TEMP/dsh-e2e-snapshot.sh" <<'SNAPSHOT'
          #!/usr/bin/env bash
          set -euo pipefail
          export LC_ALL=C
          prefix="$1"
          : "${REPOSITORY:?}" "${DEFAULT_BRANCH:?}" "${CANDIDATE_MODE:?}"
          gh api "repos/$REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha > "$prefix.main"
          if [[ "$CANDIDATE_MODE" == "pull-request" ]]; then
            : "${CANDIDATE_PR:?}"
            gh api "repos/$REPOSITORY/pulls/$CANDIDATE_PR" | jq -cS '{
              number,state,draft,
              head:{repo:.head.repo.full_name,ref:.head.ref,sha:.head.sha},
              base:{repo:.base.repo.full_name,ref:.base.ref,sha:.base.sha},
              body:(.body // "")
            }' > "$prefix.candidate"
          else
            jq -cn --arg mode "$CANDIDATE_MODE" --arg sha "$CANDIDATE_SHA" \
              '{mode:$mode,sha:$sha}' > "$prefix.candidate"
          fi
          gh api --paginate "repos/$REPOSITORY/pulls?state=all&per_page=100" \
            --jq '.[].number' | sort -n > "$prefix.prs"
          if [[ "$CANDIDATE_MODE" == "pull-request" ]]; then
            gh api --paginate "repos/$REPOSITORY/issues/$CANDIDATE_PR/comments?per_page=100" \
              --jq '.[] | {id,userId:.user.id,updatedAt:.updated_at,body}' \
              | jq -cS . | sort > "$prefix.comments"
          else
            : > "$prefix.comments"
          fi
          gh api --paginate "repos/$REPOSITORY/git/matching-refs/heads/dsh/task-?per_page=100" \
            --jq '.[] | [.ref,.object.type,.object.sha] | @tsv' | sort > "$prefix.task-refs"
          gh api --paginate "repos/$REPOSITORY/pulls?state=all&per_page=100" --jq '
            .[] |
            select(
              ((.head.ref // "") | startswith("dsh/task-")) or
              ((.body // "") | contains("<!-- dsh-action:task:v1 "))
            ) |
            {
              number,state,draft,
              head:{repo:.head.repo.full_name,ref:.head.ref,sha:.head.sha},
              base:{repo:.base.repo.full_name,ref:.base.ref,sha:.base.sha},
              bodyMarker:((.body // "") | contains("<!-- dsh-action:task:v1 ")),
              body:(.body // "")
            }
          ' | jq -cS . | sort > "$prefix.task-prs"
          SNAPSHOT
          chmod 700 "$RUNNER_TEMP/dsh-e2e-snapshot.sh"

          prefix="$RUNNER_TEMP/dsh-e2e-baseline"
          "$RUNNER_TEMP/dsh-e2e-snapshot.sh" "$prefix"
          bash .github/e2e/assert-candidate-binding.sh
          echo "main_sha=$(cat "$prefix.main")" >> "$GITHUB_OUTPUT"

      - name: Native trusted-write workspace path
        id: native_write
        uses: ./candidate-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          dsh-mode: native
          isolation: docker
          command: task
          task-access: write
          allow-write: "true"
          prompt: Inspect package.json and report its current package version. Do not modify any file and do not create a commit, branch, or pull request.
          permission-profile: custom
          allowed-tools: '["workspace.edit"]'
          progress-comment: "false"
          run-tests: "true"
          test-commands: '[["npm","ci","--ignore-scripts"],["npm","run","typecheck"],["npm","test"]]'
          max-controller-steps: "2"
          timeout-minutes: "12"

      - name: Assert native trusted-write authority
        shell: bash
        env:
          RESULT_JSON: ${{ steps.native_write.outputs['result-json'] }}
        run: |
          set -euo pipefail
          jq -e '
            .schemaVersion == 2 and .termination.conclusion == "success" and .operation.kind == "task" and
            .context.policy.trust == "trusted-write" and
            .context.dsh.mode == "native" and .context.dsh.composition == "dsh-native-headless" and
            .context.permission.effectiveTools == ["workspace.edit"] and
            .context.permission.workspaceWrite == true and
            .context.toolPolicy.policyOwner == "dsh" and (.context.toolPolicy.observedTools | length > 0) and
            (.context.toolPolicy | has("effectiveTools") | not) and
            (.context.toolPolicy | has("requestedTools") | not) and
            (.context.toolPolicy | has("deniedTools") | not) and
            .agent.isolation.backend == "docker" and .agent.isolation.workspaceAccess == "read-write" and
            .publication.writeStatus == "no-changes"
          ' <<<"$RESULT_JSON" >/dev/null

      - name: Start deterministic integrity fixture
        id: integrity_fixture
        shell: bash
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/dsh-e2e-integrity-audit.jsonl"
          endpoint="$RUNNER_TEMP/dsh-e2e-integrity-endpoint.json"
          : > "$audit"
          DSH_E2E_INTEGRITY_AUDIT="$audit" node .github/e2e/integrity-llm.mjs > "$endpoint" 2> "$RUNNER_TEMP/dsh-e2e-integrity.log" &
          pid=$!
          echo "pid=$pid" >> "$GITHUB_OUTPUT"
          for _ in {1..60}; do
            if [[ -s "$endpoint" ]] && curl --fail --silent "$(jq -r .healthUrl "$endpoint")" >/dev/null; then break; fi
            kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/dsh-e2e-integrity.log" >&2; exit 1; }
            sleep 1
          done
          curl --fail --silent "$(jq -r .healthUrl "$endpoint")" >/dev/null
          echo "base_url=$(jq -r .baseUrl "$endpoint")" >> "$GITHUB_OUTPUT"

      - name: Validation Integrity blocks weakened entrypoint
        id: integrity
        continue-on-error: true
        uses: ./candidate-action
        with:
          deepseek-api-key: dsh-e2e-integrity-fixture-key
          base-url: ${{ steps.integrity_fixture.outputs.base_url }}
          github-token: ${{ github.token }}
          command: task
          task-access: write
          allow-write: "true"
          prompt: DSH_E2E_INTEGRITY_FIXTURE. Use the available Bash tool exactly once to replace scripts/verify-dsh-config.mjs with the single line process.exit(0). Make no other change and do not restore it.
          permission-profile: custom
          allowed-tools: '["workspace.edit","native.bash"]'
          progress-comment: "false"
          validation-integrity: strict
          run-tests: "true"
          test-commands: '[["node","scripts/verify-dsh-config.mjs"]]'
          max-controller-steps: "1"
          timeout-minutes: "15"

      - name: Assert integrity failure
        shell: bash
        env:
          RESULT_JSON: ${{ steps.integrity.outputs['result-json'] }}
          EXPECTED_FAILURE: ${{ steps.integrity.outcome == 'failure' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_FAILURE" == "true" ]]
          jq -e '
            .termination.conclusion == "failure" and .termination.status == "validation_failed" and
            .termination.error.code == "VALIDATION_INTEGRITY" and .termination.error.category == "domain" and
            .termination.error.phase == "validation" and .termination.error.retryable == false and
            .validation.status == "failed" and
            .validation.integrity.mode == "strict" and
            .validation.integrity.status == "blocked" and
            .validation.integrity.dangerousChangeCount >= 1 and
            .validation.integrity.controlPlaneChangeCount >= 1 and
            (.validation.integrity.changes | any(
              .path == "scripts/verify-dsh-config.mjs" and
              .change == "modified" and .category == "entrypoint" and
              .risk == "dangerous" and .controlPlane == true and
              (.reasons | any(contains("no-op")))
            )) and
            (.publication // {} | del(.review,.commentId) | length == 0) and
            (.agent.dshToolReceipts | any(.id == "native.bash" and .completed == true and .ok == true))
          ' <<<"$RESULT_JSON" >/dev/null

          jq -s -e '
            map(.phase) == ["bash-issued", "bash-observed"] and
            all(.tool == "bash" and .callId == "integrity-bash-once")
          ' "$RUNNER_TEMP/dsh-e2e-integrity-audit.jsonl" >/dev/null

      - name: Stop deterministic integrity fixture
        if: always()
        shell: bash
        env:
          FIXTURE_PID: ${{ steps.integrity_fixture.outputs.pid }}
        run: |
          if [[ "$FIXTURE_PID" =~ ^[1-9][0-9]*$ ]]; then
            kill -TERM "$FIXTURE_PID" 2>/dev/null || true
          fi

      - name: Assert expected failures made no GitHub mutation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/dsh-e2e-baseline"
          current="$RUNNER_TEMP/dsh-e2e-current-integrity"
          "$RUNNER_TEMP/dsh-e2e-snapshot.sh" "$current"
          for component in main candidate prs comments task-refs task-prs; do
            cmp "$prefix.$component" "$current.$component"
          done

      - name: Ordinary validation failure
        id: validation
        continue-on-error: true
        uses: ./candidate-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          command: task
          task-access: write
          allow-write: "true"
          prompt: Request command.prepare-validation exactly once. After the fixed Controller command succeeds, finalize without calling native.bash or changing anything else.
          permission-profile: standard
          allowed-tools: '["command.prepare-validation"]'
          disallowed-tools: '["native.bash","native.web-search","native.subagent"]'
          tool-config: >-
            {"schemaVersion":1,"commands":[{"name":"prepare-validation","description":"Create the ordinary validation-failure marker.","argv":["node","-e","require('node:fs').writeFileSync('dsh-e2e-validation-${{ github.run_id }}-${{ github.run_attempt }}.txt','validation-failure\\n')"],"timeoutMinutes":1,"maxOutputBytes":16384,"maxCalls":1,"network":"none","workspaceAccess":"write"}]}
          progress-comment: "false"
          validation-integrity: strict
          run-tests: "true"
          test-commands: '[["false"]]'
          max-controller-steps: "2"
          timeout-minutes: "15"

      - name: Assert ordinary validation failure and no mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
          RESULT_JSON: ${{ steps.validation.outputs['result-json'] }}
          EXPECTED_FAILURE: ${{ steps.validation.outcome == 'failure' }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_FAILURE" == "true" ]]
          jq -e '
            .termination.conclusion == "failure" and .termination.status == "validation_failed" and
            .termination.error.code == "VALIDATION_FAILED" and .termination.error.category == "domain" and
            .termination.error.phase == "validation" and .termination.error.retryable == false and
            .validation.status == "failed" and
            .validation.integrity.mode == "strict" and
            .validation.integrity.status == "clean" and
            .validation.integrity.dangerousChangeCount == 0 and
            (.agent.toolReceipts | any(.id == "command.prepare-validation" and .ok == true)) and
            (.agent.dshToolReceipts // [] | all(.id != "native.bash"))
          ' <<<"$RESULT_JSON" >/dev/null
          prefix="$RUNNER_TEMP/dsh-e2e-baseline"
          current="$RUNNER_TEMP/dsh-e2e-current-validation"
          "$RUNNER_TEMP/dsh-e2e-snapshot.sh" "$current"
          for component in main candidate prs comments task-refs task-prs; do
            cmp "$prefix.$component" "$current.$component"
          done

      - name: Real native.subagent with no-change write
        id: no_change
        uses: ./candidate-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          command: task
          task-access: write
          allow-write: "true"
          prompt: Call the available Subagent tool exactly once for a read-only inspection of README.md. After it returns, make no workspace changes, call no other tool, and summarize its answer.
          permission-profile: custom
          allowed-tools: '["workspace.read","workspace.search","workspace.edit","native.subagent"]'
          disallowed-tools: '["native.bash","native.web-search"]'
          progress-comment: "false"
          run-tests: "true"
          test-commands: '[["npm","ci","--ignore-scripts"],["npm","run","typecheck"],["npm","test"]]'
          max-controller-steps: "2"
          timeout-minutes: "15"

      - name: Assert native.subagent and no-change semantics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
          RESULT_JSON: ${{ steps.no_change.outputs['result-json'] }}
        run: |
          set -euo pipefail
          jq -e '
            .termination.conclusion == "success" and .context.policy.trust == "trusted-write" and
            .publication.writeStatus == "no-changes" and .publication.changedPaths == [] and
            .validation.status == "not-applicable" and
            (.agent.dshToolReceipts | map(select(.id == "native.subagent" and .completed == true and .ok == true)) | length == 1) and
            (.agent.dshToolReceipts | all(.id != "native.bash" and .id != "native.web-search"))
          ' <<<"$RESULT_JSON" >/dev/null
          prefix="$RUNNER_TEMP/dsh-e2e-baseline"
          current="$RUNNER_TEMP/dsh-e2e-current-no-change"
          "$RUNNER_TEMP/dsh-e2e-snapshot.sh" "$current"
          for component in main candidate prs comments task-refs task-prs; do
            cmp "$prefix.$component" "$current.$component"
          done

      - name: Trusted standard Bash write
        id: trusted
        uses: ./candidate-action
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          github-token: ${{ github.token }}
          command: task
          task-access: write
          allow-write: "true"
          base-branch: ${{ needs.gate.outputs.candidate_branch }}
          branch-prefix: dsh-e2e/
          branch-name-template: "{{prefix}}task-{{key}}"
          prompt: Use the available Bash tool exactly once to create dsh-e2e-write-${{ github.run_id }}-${{ github.run_attempt }}.txt containing exactly trusted-write followed by a newline. Make no other change.
          permission-profile: standard
          disallowed-tools: '["native.web-search","native.subagent"]'
          progress-comment: "false"
          validation-integrity: strict
          run-tests: "true"
          test-commands: '[["node",".github/e2e/assert-trusted-write.mjs","dsh-e2e-write-${{ github.run_id }}-${{ github.run_attempt }}.txt"]]'
          max-controller-steps: "2"
          timeout-minutes: "18"

      - name: Verify trusted write PR identity
        id: verify_write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_BRANCH: ${{ needs.gate.outputs.candidate_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
          RESULT_JSON: ${{ steps.trusted.outputs['result-json'] }}
          FILE_PATH: dsh-e2e-write-${{ github.run_id }}-${{ github.run_attempt }}.txt
        run: |
          set -euo pipefail
          jq -e --arg path "$FILE_PATH" '
            .termination.conclusion == "success" and .context.policy.trust == "trusted-write" and
            .validation.status == "passed" and .validation.integrity.mode == "strict" and
            .publication.writeStatus == "success" and
            (.publication.branchName | test("^dsh-e2e/task-[a-f0-9]{24}$")) and
            (.publication.pullRequestNumber | type == "number") and
            (.agent.dshToolReceipts | any(.id == "native.bash" and .completed == true and .ok == true))
          ' <<<"$RESULT_JSON" >/dev/null

          branch="$(jq -r .publication.branchName <<<"$RESULT_JSON")"
          pull="$(jq -r .publication.pullRequestNumber <<<"$RESULT_JSON")"
          [[ "$branch" =~ ^dsh-e2e/task-[a-f0-9]{24}$ ]]
          [[ "$pull" =~ ^[1-9][0-9]*$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pull=$pull" >> "$GITHUB_OUTPUT"
          operation="${branch#dsh-e2e/task-}"
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pull")"
          head_sha="$(jq -r .head.sha <<<"$pr_json")"
          base_sha="$CANDIDATE_SHA"
          jq -e --arg repo "${REPOSITORY,,}" --arg base "$BASE_BRANCH" --arg branch "$branch" '
            .state == "open" and (.head.repo.full_name | ascii_downcase) == $repo and
            (.base.repo.full_name | ascii_downcase) == $repo and
            .head.ref == $branch and .base.ref == $base
          ' <<<"$pr_json" >/dev/null
          grep -Eq "<!-- dsh-action:task:v1 operation=$operation snapshot=[a-f0-9]{24} -->" <<<"$(jq -r .body <<<"$pr_json")"
          commit_json="$(gh api "repos/$REPOSITORY/git/commits/$head_sha")"
          [[ "$(jq -r '.parents | length' <<<"$commit_json")" -eq 1 ]]
          [[ "$(jq -r '.parents[0].sha' <<<"$commit_json")" == "$base_sha" ]]
          grep -Fxq "DSH-Task-Key: $operation" <<<"$(jq -r .message <<<"$commit_json")"
          [[ "$(gh api "repos/$REPOSITORY/git/ref/heads/$branch" --jq .object.sha)" == "$head_sha" ]]
          gh api "repos/$REPOSITORY/compare/$base_sha...$head_sha" \
            | jq -e --arg path "$FILE_PATH" '.files | length == 1 and .[0].filename == $path and .[0].status == "added"' >/dev/null
          content="$(gh api "repos/$REPOSITORY/contents/$FILE_PATH?ref=$head_sha" --jq .content | tr -d '\n' | base64 --decode)"
          [[ "$content" == "trusted-write" ]]
          bash .github/e2e/assert-candidate-binding.sh

      - name: Close only the verified E2E PR and delete its branch
        if: ${{ always() && steps.trusted.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_BRANCH: ${{ needs.gate.outputs.candidate_branch }}
          BRANCH: ${{ steps.verify_write.outputs.branch }}
          PULL: ${{ steps.verify_write.outputs.pull }}
          RESULT_JSON: ${{ steps.trusted.outputs['result-json'] }}
          BASE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          FILE_PATH: dsh-e2e-write-${{ github.run_id }}-${{ github.run_attempt }}.txt
        run: |
          set -euo pipefail
          branch="$BRANCH"
          pull="$PULL"
          if [[ ! "$branch" =~ ^dsh-e2e/task-[a-f0-9]{24}$ ]] || [[ ! "$pull" =~ ^[1-9][0-9]*$ ]]; then
            if jq -e '
              (.publication.branchName | type == "string" and test("^dsh-e2e/task-[a-f0-9]{24}$")) and
              (.publication.pullRequestNumber | type == "number" and . >= 1 and floor == .)
            ' <<<"$RESULT_JSON" >/dev/null 2>&1; then
              branch="$(jq -r .publication.branchName <<<"$RESULT_JSON")"
              pull="$(jq -r .publication.pullRequestNumber <<<"$RESULT_JSON")"
            else
              echo "::warning::Could not recover a verified E2E branch/PR identity from the trusted-write result; inspect run $GITHUB_RUN_ID for a dsh-e2e/task-* PR containing $FILE_PATH. No broad cleanup was attempted."
              {
                echo "### E2E cleanup requires inspection"
                echo
                echo "The trusted-write result did not expose a strictly valid branch and PR number. Inspect this run for a same-repository \`dsh-e2e/task-*\` PR whose only added file is \`$FILE_PATH\`. The harness deliberately did not delete any unverified ref."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          [[ "$branch" =~ ^dsh-e2e/task-[a-f0-9]{24}$ ]] || exit 1
          [[ "$pull" =~ ^[1-9][0-9]*$ ]] || exit 1
          operation="${branch#dsh-e2e/task-}"
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pull")"
          head_sha="$(jq -r .head.sha <<<"$pr_json")"
          jq -e --arg repo "${REPOSITORY,,}" --arg base "$BASE_BRANCH" --arg branch "$branch" '
            .state == "open" and (.head.repo.full_name | ascii_downcase) == $repo and
            (.base.repo.full_name | ascii_downcase) == $repo and
            .head.ref == $branch and .base.ref == $base
          ' <<<"$pr_json" >/dev/null
          grep -Eq "<!-- dsh-action:task:v1 operation=$operation snapshot=[a-f0-9]{24} -->" <<<"$(jq -r .body <<<"$pr_json")"
          commit_json="$(gh api "repos/$REPOSITORY/git/commits/$head_sha")"
          [[ "$(jq -r '.parents | length' <<<"$commit_json")" -eq 1 ]]
          [[ "$(jq -r '.parents[0].sha' <<<"$commit_json")" == "$BASE_SHA" ]]
          grep -Fxq "DSH-Task-Key: $operation" <<<"$(jq -r .message <<<"$commit_json")"
          [[ "$(gh api "repos/$REPOSITORY/git/ref/heads/$branch" --jq .object.sha)" == "$head_sha" ]]
          gh api "repos/$REPOSITORY/compare/$BASE_SHA...$head_sha" \
            | jq -e --arg path "$FILE_PATH" '.files | length == 1 and .[0].filename == $path and .[0].status == "added"' >/dev/null
          content="$(gh api "repos/$REPOSITORY/contents/$FILE_PATH?ref=$head_sha" --jq .content | tr -d '\n' | base64 --decode)"
          [[ "$content" == "trusted-write" ]]
          gh api --method PATCH "repos/$REPOSITORY/pulls/$pull" -f state=closed >/dev/null
          gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
          [[ "$(gh api "repos/$REPOSITORY/pulls/$pull" --jq .state)" == "closed" ]]
          if gh api "repos/$REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "Verified E2E branch still exists after cleanup" >&2
            exit 1
          fi

      - name: Revalidate candidate identity and credential-free checkout
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
        run: |
          set -euo pipefail
          bash .github/e2e/assert-candidate-binding.sh
          ! git -C . config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          ! git -C candidate-action config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1

  cancellation:
    name: Best-effort cancellation finalization
    needs: [gate, read_only, write]
    if: needs.gate.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    environment: core-e2e
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout permanent harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          path: candidate-action
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Prepare cancellation baseline and fixture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HARNESS_SHA: ${{ needs.gate.outputs.harness_sha }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
          DEEPSEEK_SECRET_PRESENT: ${{ secrets.DEEPSEEK_API_KEY != '' }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$DEEPSEEK_SECRET_PRESENT" == "true" ]]
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]]
          [[ "$(git -C candidate-action rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          ! git -C . config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          ! git -C candidate-action config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          node --check .github/e2e/hanging-http-server.mjs

          bash .github/e2e/assert-candidate-binding.sh

          prefix="$RUNNER_TEMP/dsh-e2e-cancel-baseline"
          gh api "repos/$REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha > "$prefix.main"
          if [[ "$CANDIDATE_MODE" == "pull-request" ]]; then
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$CANDIDATE_PR")"
            jq -cS '{
              number,state,draft,
              head:{repo:.head.repo.full_name,ref:.head.ref,sha:.head.sha},
              base:{repo:.base.repo.full_name,ref:.base.ref,sha:.base.sha},
              body:(.body // "")
            }' <<<"$pr_json" > "$prefix.candidate"
            gh api --paginate "repos/$REPOSITORY/issues/$CANDIDATE_PR/comments?per_page=100" \
              --jq '.[] | {id,userId:.user.id,updatedAt:.updated_at,body}' \
              | jq -cS . | sort > "$prefix.comments"
          else
            jq -cn --arg mode "$CANDIDATE_MODE" --arg sha "$CANDIDATE_SHA" \
              '{mode:$mode,sha:$sha}' > "$prefix.candidate"
            : > "$prefix.comments"
          fi
          gh api --paginate "repos/$REPOSITORY/git/matching-refs/heads/dsh/task-?per_page=100" \
            --jq '.[] | [.ref,.object.type,.object.sha] | @tsv' | sort > "$prefix.task-refs"
          gh api --paginate "repos/$REPOSITORY/pulls?state=all&per_page=100" --jq '
            .[] |
            select(
              ((.head.ref // "") | startswith("dsh/task-")) or
              ((.body // "") | contains("<!-- dsh-action:task:v1 "))
            ) |
            {
              number,state,draft,
              head:{repo:.head.repo.full_name,ref:.head.ref,sha:.head.sha},
              base:{repo:.base.repo.full_name,ref:.base.ref,sha:.base.sha},
              bodyMarker:((.body // "") | contains("<!-- dsh-action:task:v1 ")),
              body:(.body // "")
            }
          ' | jq -cS . | sort > "$prefix.task-prs"

      - name: Create dedicated cancellation issue
        id: cancel_issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          marker="<!-- dsh-e2e:cancellation:v1 run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT candidate=$CANDIDATE_SHA -->"
          title="DSH E2E cancellation $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          body="$(printf '%s\n\n%s' "$marker" "Temporary issue owned by the trusted Core E2E cancellation harness.")"
          issue_json="$(gh api --method POST "repos/$REPOSITORY/issues" -f title="$title" -f body="$body")"
          issue_number="$(jq -r .number <<<"$issue_json")"
          issue_id="$(jq -r .id <<<"$issue_json")"
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "id=$issue_id" >> "$GITHUB_OUTPUT"
          jq -e --argjson number "$issue_number" --argjson id "$issue_id" \
            --arg title "$title" --arg body "$body" '
            .number == $number and .id == $id and .state == "open" and
            (.draft // false) == false and (has("pull_request") | not) and
            .user.id == 41898282 and .title == $title and .body == $body
          ' <<<"$issue_json" >/dev/null

      - name: Exercise graceful SIGTERM and isolated sticky transition
        id: cancel_transition
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          ISSUE_NUMBER: ${{ steps.cancel_issue.outputs.number }}
          ISSUE_ID: ${{ steps.cancel_issue.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$ISSUE_ID" =~ ^[1-9][0-9]*$ ]]

          fixture_json="$RUNNER_TEMP/dsh-e2e-hanging.json"
          node .github/e2e/hanging-http-server.mjs > "$fixture_json" 2> "$RUNNER_TEMP/dsh-e2e-hanging.log" &
          fixture_pid=$!
          action_pid=""
          cleanup_processes() {
            if [[ "$action_pid" =~ ^[1-9][0-9]*$ ]] && kill -0 "$action_pid" 2>/dev/null; then
              kill -KILL "$action_pid" 2>/dev/null || true
            fi
            kill -TERM "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup_processes EXIT
          for _ in {1..30}; do
            if [[ -s "$fixture_json" ]] && curl --fail --silent "$(jq -r .healthUrl "$fixture_json")" >/dev/null; then break; fi
            kill -0 "$fixture_pid" 2>/dev/null || { cat "$RUNNER_TEMP/dsh-e2e-hanging.log" >&2; exit 1; }
            sleep 1
          done
          base_url="$(jq -r .baseUrl "$fixture_json")"

          gh api "repos/$REPOSITORY" > "$RUNNER_TEMP/dsh-e2e-repository.json"
          issue_json="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER")"
          marker="<!-- dsh-e2e:cancellation:v1 run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT candidate=$CANDIDATE_SHA -->"
          jq -e --argjson number "$ISSUE_NUMBER" --argjson id "$ISSUE_ID" --arg marker "$marker" '
            .number == $number and .id == $id and .state == "open" and
            (has("pull_request") | not) and .user.id == 41898282 and
            (.body | contains($marker))
          ' <<<"$issue_json" >/dev/null
          jq -n \
            --slurpfile repository "$RUNNER_TEMP/dsh-e2e-repository.json" \
            --argjson issue "$issue_json" \
            --arg actor "$GITHUB_ACTOR" \
            '{action:"opened",repository:$repository[0],sender:{login:$actor},issue:$issue}' \
            > "$RUNNER_TEMP/dsh-e2e-cancel-event.json"
          : > "$RUNNER_TEMP/dsh-e2e-cancel-output"
          : > "$RUNNER_TEMP/dsh-e2e-cancel-summary"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          set +e
          env \
            "INPUT_DEEPSEEK-API-KEY=$DEEPSEEK_API_KEY" \
            "INPUT_GITHUB-TOKEN=$GH_TOKEN" \
            'INPUT_COMMAND=task' \
            'INPUT_TASK-ACCESS=read' \
            'INPUT_PROMPT=Wait for the upstream response and do not finish early.' \
            'INPUT_PERMISSION-PROFILE=strict' \
            'INPUT_PROGRESS-COMMENT=true' \
            'INPUT_MAX-CONTROLLER-STEPS=2' \
            'INPUT_TIMEOUT-MINUTES=15' \
            "INPUT_BASE-URL=$base_url" \
            GITHUB_EVENT_NAME=issues \
            GITHUB_EVENT_PATH="$RUNNER_TEMP/dsh-e2e-cancel-event.json" \
            GITHUB_OUTPUT="$RUNNER_TEMP/dsh-e2e-cancel-output" \
            GITHUB_STEP_SUMMARY="$RUNNER_TEMP/dsh-e2e-cancel-summary" \
            node candidate-action/dist/index.js > "$RUNNER_TEMP/dsh-e2e-cancel.log" 2>&1 &
          action_pid=$!
          set -e

          comment_id=""
          for _ in {1..180}; do
            if ! kill -0 "$action_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/dsh-e2e-cancel.log" >&2
              echo "Candidate exited before the cancellable progress state was observed" >&2
              exit 1
            fi
            mapfile -t matches < <(
              gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
                --jq ".[] | select(.user.id == 41898282 and (.body | contains(\"$run_url\")) and (.body | contains(\"In progress\"))) | .id"
            )
            [[ "${#matches[@]}" -le 1 ]]
            if [[ "${#matches[@]}" -eq 1 ]]; then
              comment_id="${matches[0]}"
              [[ "$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq 'length')" -eq 1 ]]
              break
            fi
            sleep 1
          done
          [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
          initial_comment="$(gh api "repos/$REPOSITORY/issues/comments/$comment_id")"
          jq -e --arg run "$run_url" '
            .user.id == 41898282 and (.body | contains($run)) and (.body | contains("In progress"))
          ' <<<"$initial_comment" >/dev/null

          kill -TERM "$action_pid"
          stopped=false
          for _ in {1..90}; do
            if ! kill -0 "$action_pid" 2>/dev/null; then stopped=true; break; fi
            sleep 2
          done
          if [[ "$stopped" != "true" ]]; then
            kill -KILL "$action_pid" 2>/dev/null || true
            echo "Candidate did not complete best-effort SIGTERM finalization" >&2
            exit 1
          fi
          set +e
          wait "$action_pid"
          action_status=$?
          set -e
          action_pid=""
          [[ "$action_status" -ne 0 ]]
          grep -q 'DSH_ABORTED' "$RUNNER_TEMP/dsh-e2e-cancel-output"

          finalized=false
          for _ in {1..60}; do
            final_comment="$(gh api "repos/$REPOSITORY/issues/comments/$comment_id")"
            if jq -e --arg run "$run_url" --argjson id "$comment_id" '
              .id == $id and .user.id == 41898282 and
              (.body | contains($run)) and
              (.body | contains("DeepSeek Harness was cancelled")) and
              ((.body | contains("In progress")) | not)
            ' <<<"$final_comment" >/dev/null; then
              finalized=true
              break
            fi
            sleep 1
          done
          if [[ "$finalized" != "true" ]]; then
            echo "Observed cancellation comment (body bounded to 4 KiB):" >&2
            jq -c '{id,userId:.user.id,body:(.body[0:4096])}' <<<"$final_comment" >&2 || true
            echo "Candidate cancellation outputs tail (bounded to 12 KiB):" >&2
            tail -c 12000 "$RUNNER_TEMP/dsh-e2e-cancel-output" >&2 || true
            echo "Candidate cancellation log tail (bounded to 12 KiB):" >&2
            tail -c 12000 "$RUNNER_TEMP/dsh-e2e-cancel.log" >&2 || true
            exit 1
          fi
          mapfile -t final_ids < <(
            gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[].id'
          )
          [[ "${#final_ids[@]}" -eq 1 && "${final_ids[0]}" == "$comment_id" ]]

          # This is the verifiable best-effort path. SIGKILL, runner loss, or host
          # termination cannot execute JavaScript finalizers and cannot promise a
          # final sticky-comment update.

      - name: Delete only the isolated comment and close its issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          ISSUE_NUMBER: ${{ steps.cancel_issue.outputs.number }}
          ISSUE_ID: ${{ steps.cancel_issue.outputs.id }}
          COMMENT_ID: ${{ steps.cancel_transition.outputs.comment_id }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$ISSUE_ID" =~ ^[1-9][0-9]*$ ]]
          marker="<!-- dsh-e2e:cancellation:v1 run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT candidate=$CANDIDATE_SHA -->"
          title="DSH E2E cancellation $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          body="$(printf '%s\n\n%s' "$marker" "Temporary issue owned by the trusted Core E2E cancellation harness.")"
          issue_json="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER")"
          jq -e --argjson number "$ISSUE_NUMBER" --argjson id "$ISSUE_ID" \
            --arg title "$title" --arg body "$body" '
            .number == $number and .id == $id and .state == "open" and
            (has("pull_request") | not) and .user.id == 41898282 and
            .title == $title and .body == $body
          ' <<<"$issue_json" >/dev/null

          mapfile -t comment_ids < <(
            gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[].id'
          )
          [[ "${#comment_ids[@]}" -le 1 ]]
          comment_id="$COMMENT_ID"
          if [[ "${#comment_ids[@]}" -eq 1 ]]; then
            if [[ ! "$comment_id" =~ ^[1-9][0-9]*$ ]]; then comment_id="${comment_ids[0]}"; fi
            [[ "$comment_id" == "${comment_ids[0]}" ]]
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            comment_json="$(gh api "repos/$REPOSITORY/issues/comments/$comment_id")"
            jq -e --argjson id "$comment_id" --arg run "$run_url" '
              .id == $id and .user.id == 41898282 and (.body | contains($run))
            ' <<<"$comment_json" >/dev/null
            gh api --method DELETE "repos/$REPOSITORY/issues/comments/$comment_id"
            if gh api "repos/$REPOSITORY/issues/comments/$comment_id" >/dev/null 2>&1; then
              echo "The isolated cancellation comment still exists" >&2
              exit 1
            fi
          else
            [[ -z "$comment_id" ]]
          fi

          gh api --method PATCH "repos/$REPOSITORY/issues/$ISSUE_NUMBER" -f state=closed >/dev/null
          closed_json="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER")"
          jq -e --argjson number "$ISSUE_NUMBER" --argjson id "$ISSUE_ID" \
            --arg title "$title" --arg body "$body" '
            .number == $number and .id == $id and .state == "closed" and
            (has("pull_request") | not) and .user.id == 41898282 and
            .title == $title and .body == $body
          ' <<<"$closed_json" >/dev/null
          [[ "$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq 'length')" -eq 0 ]]

      - name: Assert cancellation made no candidate or task mutation
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          prefix="$RUNNER_TEMP/dsh-e2e-cancel-baseline"
          current="$RUNNER_TEMP/dsh-e2e-cancel-current"

          bash .github/e2e/assert-candidate-binding.sh
          gh api "repos/$REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha > "$current.main"
          if [[ "$CANDIDATE_MODE" == "pull-request" ]]; then
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$CANDIDATE_PR")"
            jq -cS '{
              number,state,draft,
              head:{repo:.head.repo.full_name,ref:.head.ref,sha:.head.sha},
              base:{repo:.base.repo.full_name,ref:.base.ref,sha:.base.sha},
              body:(.body // "")
            }' <<<"$pr_json" > "$current.candidate"
            gh api --paginate "repos/$REPOSITORY/issues/$CANDIDATE_PR/comments?per_page=100" \
              --jq '.[] | {id,userId:.user.id,updatedAt:.updated_at,body}' \
              | jq -cS . | sort > "$current.comments"
          else
            jq -cn --arg mode "$CANDIDATE_MODE" --arg sha "$CANDIDATE_SHA" \
              '{mode:$mode,sha:$sha}' > "$current.candidate"
            : > "$current.comments"
          fi
          gh api --paginate "repos/$REPOSITORY/git/matching-refs/heads/dsh/task-?per_page=100" \
            --jq '.[] | [.ref,.object.type,.object.sha] | @tsv' | sort > "$current.task-refs"
          gh api --paginate "repos/$REPOSITORY/pulls?state=all&per_page=100" --jq '
            .[] |
            select(
              ((.head.ref // "") | startswith("dsh/task-")) or
              ((.body // "") | contains("<!-- dsh-action:task:v1 "))
            ) |
            {
              number,state,draft,
              head:{repo:.head.repo.full_name,ref:.head.ref,sha:.head.sha},
              base:{repo:.base.repo.full_name,ref:.base.ref,sha:.base.sha},
              bodyMarker:((.body // "") | contains("<!-- dsh-action:task:v1 ")),
              body:(.body // "")
            }
          ' | jq -cS . | sort > "$current.task-prs"
          for component in main candidate comments task-refs task-prs; do
            cmp "$prefix.$component" "$current.$component"
          done
          ! git -C . config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          ! git -C candidate-action config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1

  integration:
    name: GitHub integration contracts
    needs: [gate, read_only, write, cancellation]
    if: >-
      needs.gate.outputs.run_e2e == 'true' &&
      needs.read_only.result == 'success' &&
      needs.write.result == 'success' &&
      needs.cancellation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      # Only this trusted harness creates a failed check on its disposable PR.
      checks: write
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - name: Checkout permanent harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.harness_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          path: candidate-action
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install exact candidate runtime without lifecycle scripts
        shell: bash
        run: |
          npm ci --prefix candidate-action --omit=dev --ignore-scripts --no-audit --no-fund
          test -f "$GITHUB_WORKSPACE/candidate-action/node_modules/@deepseek-ai/dsh/lib/bin.js"

      - name: Prepare deterministic GitHub integration harness
        id: integration_baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HARNESS_SHA: ${{ needs.gate.outputs.harness_sha }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]]
          [[ "$(git -C candidate-action rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          ! git -C . config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          ! git -C candidate-action config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1
          node --check .github/e2e/github-integration-llm.mjs
          node --check .github/e2e/read-action-output.mjs
          bash -n .github/e2e/assert-candidate-binding.sh

          # Observe this writer-profile job's own read budget before any fixture or task.
          node .github/e2e/integration-quota.mjs "$(git hash-object action.yml)"

          gh api "repos/$REPOSITORY" > "$RUNNER_TEMP/dsh-e2e-integration-repository.json"
          bash .github/e2e/assert-candidate-binding.sh

          if [[ "$CANDIDATE_MODE" == "pull-request" ]]; then ci_event="pull_request"; else ci_event="push"; fi
          runs="$(gh api --method GET "repos/$REPOSITORY/actions/runs" \
            -f head_sha="$CANDIDATE_SHA" -f event="$ci_event" -f status=completed -f per_page=50)"
          ci_run_id="$(jq -r '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")][0].id // empty' <<<"$runs")"
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$(gh api "repos/$REPOSITORY/actions/runs/$ci_run_id" --jq .head_sha)" == "$CANDIDATE_SHA" ]]
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Create isolated Issue and draft PR fixtures
        id: integration_entities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          marker="<!-- dsh-e2e:github-integration:v1 run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT candidate=$CANDIDATE_SHA -->"
          label="dsh-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          label_description="Run-bound Core E2E fixture $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          label_json="$(gh api --method POST "repos/$REPOSITORY/labels" \
            -f name="$label" -f color=5319e7 -f description="$label_description")"
          jq -e --arg name "$label" --arg description "$label_description" '
            .name == $name and .color == "5319e7" and .description == $description
          ' <<<"$label_json" >/dev/null
          issue_title="DSH E2E GitHub integration $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          issue_body="$(printf '%s\n\n%s' "$marker" "Temporary Issue owned by the trusted GitHub integration harness.")"
          issue_json="$(gh api --method POST "repos/$REPOSITORY/issues" -f title="$issue_title" -f body="$issue_body")"
          issue_number="$(jq -r .number <<<"$issue_json")"
          issue_id="$(jq -r .id <<<"$issue_json")"
          echo "$issue_json" > "$RUNNER_TEMP/dsh-e2e-integration-issue.json"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_id=$issue_id" >> "$GITHUB_OUTPUT"
          jq -e --argjson number "$issue_number" --argjson id "$issue_id" --arg title "$issue_title" --arg body "$issue_body" '
            .number == $number and .id == $id and .state == "open" and
            (has("pull_request") | not) and .user.id == 41898282 and
            .title == $title and .body == $body and .labels == [] and .assignees == []
          ' <<<"$issue_json" >/dev/null

          history="DSH_E2E_HISTORY_HIDDEN_$GITHUB_RUN_ID"
          history_json="$(gh api --method POST "repos/$REPOSITORY/issues/$issue_number/comments" -f body="$history")"
          history_id="$(jq -r .id <<<"$history_json")"
          [[ "$history_id" =~ ^[1-9][0-9]*$ ]]
          echo "history_id=$history_id" >> "$GITHUB_OUTPUT"

          base_branch="dsh-e2e/checks-base-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          branch="dsh-e2e/checks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fixture_path=".github/dsh-e2e-fixtures/checks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          base_fixture_content="DSH E2E checks base $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          fixture_content="DSH E2E checks head $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          [[ "$base_branch" =~ ^dsh-e2e/checks-base-[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$branch" =~ ^dsh-e2e/checks-[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$fixture_path" =~ ^\.github/dsh-e2e-fixtures/checks-[1-9][0-9]*-[1-9][0-9]*\.txt$ ]]
          echo "base_branch=$base_branch" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "fixture_path=$fixture_path" >> "$GITHUB_OUTPUT"
          if gh api "repos/$REPOSITORY/git/ref/heads/$base_branch" >/dev/null 2>&1; then
            echo "The isolated checks base branch already exists" >&2
            exit 1
          fi
          if gh api "repos/$REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "The isolated checks branch already exists" >&2
            exit 1
          fi

          base_blob_sha="$(jq -cn --arg content "$base_fixture_content" '{content:$content,encoding:"utf-8"}' \
            | gh api --method POST "repos/$REPOSITORY/git/blobs" --input - --jq .sha)"
          validator_blob_sha="$(jq -cn --rawfile content .github/e2e/validate-business-file.mjs '{content:$content,encoding:"utf-8"}' \
            | gh api --method POST "repos/$REPOSITORY/git/blobs" --input - --jq .sha)"
          [[ "$validator_blob_sha" == "$(git hash-object .github/e2e/validate-business-file.mjs)" ]]
          base_tree_sha="$(jq -cn --arg path "$fixture_path" --arg sha "$base_blob_sha" \
            --arg validator "$validator_blob_sha" \
            '{tree:[{path:$path,mode:"100644",type:"blob",sha:$sha},
                    {path:".github/dsh-e2e-fixtures/validate-business-file.mjs",mode:"100644",type:"blob",sha:$validator}]}' \
            | gh api --method POST "repos/$REPOSITORY/git/trees" --input - --jq .sha)"
          base_commit_message="DSH E2E checks base $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          base_sha="$(jq -cn --arg message "$base_commit_message" --arg tree "$base_tree_sha" --arg parent "$CANDIDATE_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/$REPOSITORY/git/commits" --input - --jq .sha)"
          [[ "$base_blob_sha" =~ ^[a-f0-9]{40}$ && "$base_tree_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$base_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "base_tree_sha=$base_tree_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          node .github/e2e/fixture-ref.mjs create "$base_branch" "$base_sha"

          blob_sha="$(jq -cn --arg content "$fixture_content" '{content:$content,encoding:"utf-8"}' \
            | gh api --method POST "repos/$REPOSITORY/git/blobs" --input - --jq .sha)"
          tree_sha="$(jq -cn --arg base "$base_tree_sha" --arg path "$fixture_path" --arg sha "$blob_sha" \
            '{base_tree:$base,tree:[{path:$path,mode:"100644",type:"blob",sha:$sha}]}' \
            | gh api --method POST "repos/$REPOSITORY/git/trees" --input - --jq .sha)"
          commit_message="DSH E2E checks fixture $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          head_sha="$(jq -cn --arg message "$commit_message" --arg tree "$tree_sha" --arg parent "$base_sha" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/$REPOSITORY/git/commits" --input - --jq .sha)"
          [[ "$blob_sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$tree_sha" =~ ^[a-f0-9]{40}$ && "$head_sha" =~ ^[a-f0-9]{40}$ ]]
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          node .github/e2e/fixture-ref.mjs create "$branch" "$head_sha"

          pr_title="DSH E2E checks $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          pr_body="$(printf '%s\n\n%s' "$marker" "Temporary draft PR owned by the trusted GitHub integration harness.")"
          pr_json="$(gh api --method POST "repos/$REPOSITORY/pulls" \
            -f title="$pr_title" -f head="$branch" -f base="$base_branch" -f body="$pr_body" -F draft=true)"
          pr_number="$(jq -r .number <<<"$pr_json")"
          pr_id="$(jq -r .id <<<"$pr_json")"
          echo "$pr_json" > "$RUNNER_TEMP/dsh-e2e-integration-pr.json"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_id=$pr_id" >> "$GITHUB_OUTPUT"
          jq -e --argjson number "$pr_number" --argjson id "$pr_id" --arg repo "${REPOSITORY,,}" \
            --arg branch "$branch" --arg base "$base_branch" --arg sha "$head_sha" \
            --arg base_sha "$base_sha" --arg title "$pr_title" --arg body "$pr_body" '
            .number == $number and .id == $id and .state == "open" and .draft == true and
            (.head.repo.full_name | ascii_downcase) == $repo and .head.ref == $branch and .head.sha == $sha and
            (.base.repo.full_name | ascii_downcase) == $repo and .base.ref == $base and .base.sha == $base_sha and
            .title == $title and .body == $body
          ' <<<"$pr_json" >/dev/null

      - name: Exercise routes, filters, structured output, and typed GitHub tools
        id: integration_contracts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          ISSUE_NUMBER: ${{ steps.integration_entities.outputs.issue_number }}
          ISSUE_ID: ${{ steps.integration_entities.outputs.issue_id }}
          ISSUE_LABEL: ${{ steps.integration_entities.outputs.label }}
          HISTORY_ID: ${{ steps.integration_entities.outputs.history_id }}
          CHECKS_PR: ${{ steps.integration_entities.outputs.pr_number }}
          CHECKS_HEAD: ${{ steps.integration_entities.outputs.head_sha }}
          CHECKS_PR_ID: ${{ steps.integration_entities.outputs.pr_id }}
          CHECKS_BASE_BRANCH: ${{ steps.integration_entities.outputs.base_branch }}
          CHECKS_BASE_SHA: ${{ steps.integration_entities.outputs.base_sha }}
          FIXTURE_PATH: ${{ steps.integration_entities.outputs.fixture_path }}
          CI_RUN_ID: ${{ steps.integration_baseline.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$ISSUE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ISSUE_LABEL" =~ ^dsh-e2e-[1-9][0-9]*-[1-9][0-9]*$ ]]
          [[ "$HISTORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHECKS_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHECKS_HEAD" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]

          audit="$RUNNER_TEMP/dsh-e2e-github-audit.jsonl"
          fixture_info="$RUNNER_TEMP/dsh-e2e-github-fixture.json"
          fixture_log="$RUNNER_TEMP/dsh-e2e-github-fixture.log"
          fixture_key="sk-dsh-e2e-fixture-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mutated_pull_title="DSH E2E checks updated $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          : > "$audit"
          DSH_E2E_GITHUB_AUDIT="$audit" DSH_E2E_FIXTURE_KEY="$fixture_key" \
            DSH_E2E_ISSUE_LABEL="$ISSUE_LABEL" DSH_E2E_ISSUE_ASSIGNEE="$GITHUB_ACTOR" \
            DSH_E2E_PULL_TITLE="$mutated_pull_title" \
            DSH_E2E_FIXTURE_PATH="$FIXTURE_PATH" \
            DSH_E2E_IMPLEMENTATION_PATH="dsh-e2e-implementation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt" \
            DSH_E2E_RUN_SUFFIX="$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            node .github/e2e/github-integration-llm.mjs > "$fixture_info" 2> "$fixture_log" &
          fixture_pid=$!
          cleanup_fixture() {
            kill -TERM "$fixture_pid" 2>/dev/null || true
            wait "$fixture_pid" 2>/dev/null || true
          }
          trap cleanup_fixture EXIT
          for _ in {1..30}; do
            if [[ -s "$fixture_info" ]] && curl --fail --silent "$(jq -r .healthUrl "$fixture_info")" >/dev/null; then break; fi
            kill -0 "$fixture_pid" 2>/dev/null || { cat "$fixture_log" >&2; exit 1; }
            sleep 1
          done
          origin="$(jq -r .origin "$fixture_info")"
          [[ "$origin" =~ ^http://127\.0\.0\.1:[1-9][0-9]*$ ]]

          repository_file="$RUNNER_TEMP/dsh-e2e-integration-repository.json"
          issue_file="$RUNNER_TEMP/dsh-e2e-integration-issue.json"
          pr_file="$RUNNER_TEMP/dsh-e2e-integration-pr.json"
          actor="$GITHUB_ACTOR"
          jq -n --slurpfile repository "$repository_file" --slurpfile issue "$issue_file" --arg actor "$actor" '
            {action:"labeled",repository:$repository[0],sender:{login:$actor},issue:$issue[0],label:{name:"dsh-e2e-label"}}
          ' > "$RUNNER_TEMP/dsh-e2e-label-event.json"
          jq -n --slurpfile repository "$repository_file" --slurpfile issue "$issue_file" --arg actor "$actor" '
            {action:"assigned",repository:$repository[0],sender:{login:$actor},issue:$issue[0],assignee:{login:"dsh-e2e-assignee"}}
          ' > "$RUNNER_TEMP/dsh-e2e-assignee-event.json"
          trigger_id=$((HISTORY_ID + 1000000))
          trigger_body="$(printf '%s\n%s\n%s\n%s\n%s\n%s\n%s' \
            "/deepseek task --write exercise the typed GitHub comment tool" \
            "DSH_E2E_TRIGGER_VISIBLE_$GITHUB_RUN_ID" \
            "![attachment](https://github.com/user-attachments/assets/dsh-e2e-inline-must-not-forward)" \
            "![reference][dsh-e2e-reference]" \
            "[dsh-e2e-reference]: https://github.com/user-attachments/assets/dsh-e2e-reference-must-not-forward" \
            '<picture><source srcset="https://github.com/user-attachments/assets/dsh-e2e-source-must-not-forward"><img src="https://github.com/user-attachments/assets/dsh-e2e-html-must-not-forward"></picture>' \
            "https://github.com/user-attachments/assets/dsh-e2e-raw-must-not-forward")"
          jq -n --slurpfile repository "$repository_file" --slurpfile issue "$issue_file" \
            --arg actor "$actor" --arg body "$trigger_body" --argjson trigger_id "$trigger_id" '
            {action:"created",repository:$repository[0],sender:{login:$actor},issue:$issue[0],comment:{
              id:$trigger_id,body:$body,created_at:"2099-01-01T00:00:00Z",updated_at:"2099-01-01T00:00:00Z",user:{login:$actor}
            }}
          ' > "$RUNNER_TEMP/dsh-e2e-github-event.json"
          jq -n --slurpfile repository "$repository_file" --slurpfile pull "$pr_file" --arg actor "$actor" '
            {action:"synchronize",repository:$repository[0],sender:{login:$actor},pull_request:$pull[0]}
          ' > "$RUNNER_TEMP/dsh-e2e-checks-event.json"

          task_schema='{"type":"object","properties":{"route":{"type":"string","enum":["label","assignee","github"]},"accepted":{"type":"boolean","const":true}},"required":["route","accepted"],"additionalProperties":false}'
          run_candidate() {
            local name="$1" event_name="$2" event_path="$3" fixture_route="$4"
            shift 4
            local output="$RUNNER_TEMP/dsh-e2e-${name}-output"
            local summary="$RUNNER_TEMP/dsh-e2e-${name}-summary"
            local log="$RUNNER_TEMP/dsh-e2e-${name}.log"
            : > "$output"
            : > "$summary"
            if ! env \
              "INPUT_DEEPSEEK-API-KEY=$fixture_key" \
              "INPUT_GITHUB-TOKEN=$GH_TOKEN" \
              'INPUT_PROGRESS-COMMENT=false' \
              'INPUT_TIMEOUT-MINUTES=15' \
              "INPUT_BASE-URL=$origin/$fixture_route" \
              "GITHUB_EVENT_NAME=$event_name" \
              "GITHUB_EVENT_PATH=$event_path" \
              "GITHUB_OUTPUT=$output" \
              "GITHUB_STEP_SUMMARY=$summary" \
              "$@" \
              node candidate-action/dist/index.js > "$log" 2>&1; then
              cat "$log" >&2
              return 1
            fi
          }
          read_output() {
            node .github/e2e/read-action-output.mjs "$RUNNER_TEMP/dsh-e2e-$1-output" "$2"
          }

          run_candidate label issues "$RUNNER_TEMP/dsh-e2e-label-event.json" label \
            'INPUT_COMMAND=auto' 'INPUT_LABEL-TRIGGER=dsh-e2e-label' \
            "INPUT_ALLOWED-ACTORS=$actor" 'INPUT_TASK-ACCESS=read' 'INPUT_ISOLATION=none' \
            "INPUT_DSH-EXECUTABLE=$GITHUB_WORKSPACE/candidate-action/node_modules/@deepseek-ai/dsh/lib/bin.js" \
            'INPUT_PROMPT=Return the deterministic label task result.' \
            "INPUT_TASK-OUTPUT-SCHEMA=$task_schema" 'INPUT_MAX-CONTROLLER-STEPS=1'
          label_result="$(read_output label result-json)"
          label_task="$(jq -c .operation.taskOutput <<<"$label_result")"
          jq -c '{stage:"label",conclusion:.termination.conclusion,status:.termination.status,operation:.operation.kind,trust:.context.policy.trust,taskOutput:.operation.taskOutput}' <<<"$label_result"
          jq -e '.termination.conclusion == "success" and .operation.kind == "task" and .context.policy.trust == "trusted-read" and .operation.taskOutput == {route:"label",accepted:true}' <<<"$label_result" >/dev/null
          jq -e '. == {route:"label",accepted:true}' <<<"$label_task" >/dev/null

          run_candidate assignee issues "$RUNNER_TEMP/dsh-e2e-assignee-event.json" assignee \
            'INPUT_COMMAND=auto' 'INPUT_ASSIGNEE-TRIGGER=dsh-e2e-assignee' \
            "INPUT_ALLOWED-ACTORS=$actor" 'INPUT_TASK-ACCESS=read' 'INPUT_ISOLATION=none' \
            "INPUT_DSH-EXECUTABLE=$GITHUB_WORKSPACE/candidate-action/node_modules/@deepseek-ai/dsh/lib/bin.js" \
            'INPUT_PROMPT=Return the deterministic assignee task result.' \
            "INPUT_TASK-OUTPUT-SCHEMA=$task_schema" 'INPUT_MAX-CONTROLLER-STEPS=1'
          assignee_result="$(read_output assignee result-json)"
          jq -c '{stage:"assignee",conclusion:.termination.conclusion,status:.termination.status,operation:.operation.kind,trust:.context.policy.trust,taskOutput:.operation.taskOutput}' <<<"$assignee_result"
          jq -e '.termination.conclusion == "success" and .operation.kind == "task" and .operation.taskOutput == {route:"assignee",accepted:true}' <<<"$assignee_result" >/dev/null

          run_candidate denied issues "$RUNNER_TEMP/dsh-e2e-label-event.json" label \
            'INPUT_COMMAND=auto' 'INPUT_LABEL-TRIGGER=dsh-e2e-label' \
            'INPUT_ALLOWED-ACTORS=dsh-e2e-no-match' 'INPUT_TASK-ACCESS=read' \
            'INPUT_PROMPT=This route must remain neutral.' 'INPUT_MAX-CONTROLLER-STEPS=1'
          denied_result="$(read_output denied result-json)"
          jq -c '{stage:"denied",conclusion:.termination.conclusion,status:.termination.status,operation:.operation.kind,trust:.context.policy.trust}' <<<"$denied_result"
          jq -e '.termination.conclusion == "neutral" and .termination.status == "neutral" and .operation.kind == "none"' <<<"$denied_result" >/dev/null
          jq -s -e '[.[] | select(.route == "label")] | length == 1' "$audit" >/dev/null

          # Issue tools need a real repository snapshot, not repeated full-main downloads.
          [[ "$(gh api "repos/$REPOSITORY/git/ref/heads/$CHECKS_BASE_BRANCH" --jq .object.sha)" == "$CHECKS_BASE_SHA" ]]
          run_candidate github issue_comment "$RUNNER_TEMP/dsh-e2e-github-event.json" github \
            'INPUT_COMMAND=auto' 'INPUT_TRIGGER-PHRASE=/deepseek' \
            "INPUT_BASE-BRANCH=$CHECKS_BASE_BRANCH" \
            "INPUT_ALLOWED-ACTORS=$actor" 'INPUT_INCLUDE-COMMENTS-BY-ACTOR=*' \
            "INPUT_EXCLUDE-COMMENTS-BY-ACTOR=$actor,github-actions[bot]" \
            'INPUT_PERMISSION-PROFILE=custom' \
            'INPUT_ALLOWED-TOOLS=["workspace.edit","github.issue.labels.set","github.issue.assignees.set","github.comment.create","github.issue.state.update"]' \
            'INPUT_ALLOW-WRITE=true' 'INPUT_RUN-TESTS=true' \
            'INPUT_VALIDATION-INTEGRITY=strict' \
            'INPUT_TEST-COMMANDS=[["node","-e","process.exit(0)"]]' \
            "INPUT_TASK-OUTPUT-SCHEMA=$task_schema" 'INPUT_MAX-CONTROLLER-STEPS=5'
          github_result="$(read_output github result-json)"
          github_task="$(jq -c .operation.taskOutput <<<"$github_result")"
          jq -c '{stage:"github",conclusion:.termination.conclusion,status:.termination.status,operation:.operation.kind,trust:.context.policy.trust,validation,publication:.publication,taskOutput:.operation.taskOutput,toolReceipts:.agent.toolReceipts}' <<<"$github_result"
          jq -e '
            .termination.conclusion == "success" and .operation.kind == "task" and .context.policy.trust == "trusted-write" and
            .validation.status == "passed" and .validation.commandCount == 1 and
            .publication.writeStatus == "no-changes" and .operation.taskOutput == {route:"github",accepted:true} and
            ([.agent.toolReceipts[] | select(.id == "github.issue.labels.set" and .ok == true and .effect == "updated" and .attempts >= 1 and (.reconciled | type) == "boolean")] | length == 1) and
            ([.agent.toolReceipts[] | select(.id == "github.issue.assignees.set" and .ok == true and .effect == "updated" and .attempts >= 1 and (.reconciled | type) == "boolean")] | length == 1) and
            (.agent.toolReceipts | any(
              .id == "github.comment.create" and .ok == true and .effect == "created" and .reconciled == true and .attempts >= 1
            )) and
            ([.agent.toolReceipts[] | select(.id == "github.issue.state.update" and .ok == true and .effect == "updated" and .attempts >= 1 and (.reconciled | type) == "boolean")] | length == 1) and
            ([.agent.toolReceipts[] | select(.id | startswith("github."))] | length == 4)
          ' <<<"$github_result" >/dev/null
          jq -e '. == {route:"github",accepted:true}' <<<"$github_task" >/dev/null

          history="DSH_E2E_HISTORY_HIDDEN_$GITHUB_RUN_ID"
          trigger="DSH_E2E_TRIGGER_VISIBLE_$GITHUB_RUN_ID"
          inline_url="https://github.com/user-attachments/assets/dsh-e2e-inline-must-not-forward"
          reference_url="https://github.com/user-attachments/assets/dsh-e2e-reference-must-not-forward"
          source_url="https://github.com/user-attachments/assets/dsh-e2e-source-must-not-forward"
          html_url="https://github.com/user-attachments/assets/dsh-e2e-html-must-not-forward"
          raw_url="https://github.com/user-attachments/assets/dsh-e2e-raw-must-not-forward"
          jq -s -e --arg history "$history" --arg trigger "$trigger" \
            --arg inline "$inline_url" --arg reference "$reference_url" --arg source "$source_url" \
            --arg html "$html_url" --arg raw "$raw_url" '
            ([.[] | select(.route == "github" and .index == 1)] | length == 1) and
            ([.[] | select(.route == "github" and .index == 1)][0] |
              .authorizationMatches == true and
              (.prompt | contains($trigger)) and
              ((.prompt | contains($history)) | not) and
              (.prompt | contains("[image removed]")) and
              (.prompt as $prompt | [$inline,$reference,$source,$html,$raw] | map(. as $url |
                ($prompt | contains($url) | not) and
                ($prompt | contains(($url | split("/") | last)) | not)
              ) | all))
          ' "$audit" >/dev/null
          tool_comments="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
          jq -e '
            [.[] | select((.body // "") | contains("dsh-action:github-tool-call="))] as $tools |
            ($tools | length) == 1 and $tools[0].user.id == 41898282 and
            ($tools[0].body | contains("DSH E2E typed GitHub tool completed")) and
            (($tools[0].body | contains("@maintainers")) | not)
          ' <<<"$tool_comments" >/dev/null

          mutated_issue="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER")"
          jq -e --arg label "$ISSUE_LABEL" --arg actor "$actor" '
            .state == "closed" and .state_reason == "completed" and
            [.labels[].name] == [$label] and [.assignees[].login] == [$actor]
          ' <<<"$mutated_issue" >/dev/null
          jq -cn '{state:"open",state_reason:"reopened",labels:[],assignees:[]}' \
            | gh api --method PATCH "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --input - >/dev/null
          gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" \
            | jq -e '.state == "open" and .labels == [] and .assignees == []' >/dev/null

          run_candidate metadata pull_request "$RUNNER_TEMP/dsh-e2e-checks-event.json" metadata \
            'INPUT_COMMAND=task' 'INPUT_PROMPT=Update the bound draft PR metadata exactly as requested.' \
            'INPUT_TASK-ACCESS=write' "INPUT_ALLOWED-ACTORS=$actor" \
            'INPUT_PERMISSION-PROFILE=custom' \
            'INPUT_ALLOWED-TOOLS=["workspace.edit","github.pull.metadata.update"]' \
            'INPUT_ALLOW-WRITE=true' 'INPUT_RUN-TESTS=true' \
            'INPUT_VALIDATION-INTEGRITY=strict' \
            'INPUT_TEST-COMMANDS=[["node","-e","process.exit(0)"]]' 'INPUT_MAX-CONTROLLER-STEPS=2'
          metadata_result="$(read_output metadata result-json)"
          jq -c '{stage:"metadata",conclusion:.termination.conclusion,status:.termination.status,operation:.operation.kind,trust:.context.policy.trust,validation,publication:.publication,toolReceipts:.agent.toolReceipts}' <<<"$metadata_result"
          jq -e '
            .termination.conclusion == "success" and .operation.kind == "task" and .context.policy.trust == "trusted-write" and
            .validation.status == "passed" and .publication.writeStatus == "no-changes" and
            ([.agent.toolReceipts[] | select(
              .id == "github.pull.metadata.update" and .ok == true and .effect == "updated" and
              .attempts >= 1 and (.reconciled | type) == "boolean"
            )] | length == 1)
          ' <<<"$metadata_result" >/dev/null
          [[ "$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR" --jq .title)" == "$mutated_pull_title" ]]
          original_pull_title="DSH E2E checks $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          gh api --method PATCH "repos/$REPOSITORY/pulls/$CHECKS_PR" -f title="$original_pull_title" >/dev/null
          [[ "$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR" --jq .title)" == "$original_pull_title" ]]
          [[ "$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR" --jq .head.sha)" == "$CHECKS_HEAD" ]]

          run_candidate checks pull_request "$RUNNER_TEMP/dsh-e2e-checks-event.json" checks \
            'INPUT_COMMAND=diagnose' 'INPUT_PERMISSION-PROFILE=custom' \
            'INPUT_ALLOWED-TOOLS=["github.checks.read"]' 'INPUT_ISOLATION=none' \
            "INPUT_DSH-EXECUTABLE=$GITHUB_WORKSPACE/candidate-action/node_modules/@deepseek-ai/dsh/lib/bin.js" \
            'INPUT_MAX-CONTROLLER-STEPS=2'
          checks_result="$(read_output checks result-json)"
          jq -c '{stage:"checks",conclusion:.termination.conclusion,status:.termination.status,operation:.operation.kind,trust:.context.policy.trust,toolReceipts:.agent.toolReceipts}' <<<"$checks_result"
          jq -e '
            .termination.conclusion == "success" and .operation.kind == "diagnose" and .context.policy.trust == "trusted-read" and
            (.agent.toolReceipts | any(.id == "github.checks.read" and .ok == true and .effect == "read"))
          ' <<<"$checks_result" >/dev/null

          run_candidate native_write issue_comment "$RUNNER_TEMP/dsh-e2e-github-event.json" native-write \
            'INPUT_DSH-MODE=native' 'INPUT_COMMAND=auto' 'INPUT_TRIGGER-PHRASE=/deepseek' \
            "INPUT_ALLOWED-ACTORS=$actor" 'INPUT_INCLUDE-COMMENTS-BY-ACTOR=*' \
            "INPUT_EXCLUDE-COMMENTS-BY-ACTOR=$actor,github-actions[bot]" \
            'INPUT_PERMISSION-PROFILE=custom' 'INPUT_ALLOWED-TOOLS=["workspace.edit"]' \
            'INPUT_ALLOW-WRITE=true' 'INPUT_ISOLATION=docker' 'INPUT_MAX-CONTROLLER-STEPS=1' \
            'INPUT_RUN-TESTS=true' \
            'INPUT_TEST-COMMANDS=[["npm","ci","--ignore-scripts"],["npm","run","typecheck"],["npm","test"]]'
          native_write_result="$(read_output native_write result-json)"
          jq -c '{stage:"native-write",conclusion:.termination.conclusion,status:.termination.status,operation:.operation.kind,trust:.context.policy.trust,dsh:.context.dsh,permissions:.context.permission,toolPolicy:.context.toolPolicy,isolation:.agent.isolation,publication:.publication}' <<<"$native_write_result"
          jq -e '
            .termination.conclusion == "success" and .operation.kind == "task" and .context.policy.trust == "trusted-write" and
            .context.dsh.mode == "native" and .context.dsh.composition == "dsh-native-headless" and
            .context.permission.effectiveTools == ["workspace.edit"] and .context.permission.workspaceWrite == true and
            .context.toolPolicy.policyOwner == "dsh" and (.context.toolPolicy.observedTools | length > 0) and
            (.context.toolPolicy | has("effectiveTools") | not) and
            (.context.toolPolicy | has("requestedTools") | not) and
            (.context.toolPolicy | has("deniedTools") | not) and
            .agent.isolation.backend == "docker" and .agent.isolation.workspaceAccess == "read-write" and
            .publication.writeStatus == "no-changes" and
            (.context.authority.knownSources | length == 2) and
            (.context.authority.knownSources | all(
              .kind == "controller-credential" and .holder == "controller" and
              .credentialExposure == "not-exposed-to-worker"
            ))
          ' <<<"$native_write_result" >/dev/null

          run_candidate native_checks pull_request "$RUNNER_TEMP/dsh-e2e-checks-event.json" native-checks \
            'INPUT_DSH-MODE=native' 'INPUT_COMMAND=diagnose' 'INPUT_PERMISSION-PROFILE=custom' \
            'INPUT_ALLOWED-TOOLS=["github.checks.read"]' 'INPUT_ISOLATION=docker' \
            'INPUT_MAX-CONTROLLER-STEPS=2'
          native_checks_result="$(read_output native_checks result-json)"
          jq -c '{stage:"native-checks",conclusion:.termination.conclusion,status:.termination.status,operation:.operation.kind,trust:.context.policy.trust,dsh:.context.dsh,permissions:.context.permission,toolPolicy:.context.toolPolicy,isolation:.agent.isolation,toolReceipts:.agent.toolReceipts}' <<<"$native_checks_result"
          jq -e '
            .termination.conclusion == "success" and .operation.kind == "diagnose" and .context.policy.trust == "trusted-read" and
            .context.dsh.mode == "native" and .context.dsh.composition == "dsh-native-headless" and
            .context.permission.effectiveTools == ["github.checks.read"] and
            .context.toolPolicy.policyOwner == "dsh" and (.context.toolPolicy.observedTools | length > 0) and
            (.context.toolPolicy | has("effectiveTools") | not) and
            (.context.toolPolicy | has("requestedTools") | not) and
            (.context.toolPolicy | has("deniedTools") | not) and
            .agent.isolation.backend == "docker" and .agent.isolation.workspaceAccess == "read-only" and
            (.agent.toolReceipts | any(.id == "github.checks.read" and .ok == true and .effect == "read"))
          ' <<<"$native_checks_result" >/dev/null

          # PR review must publish both its sticky summary and an inline comment
          # anchored to the actual immutable fixture diff.
          run_candidate review pull_request "$RUNNER_TEMP/dsh-e2e-checks-event.json" review \
            'INPUT_COMMAND=review' 'INPUT_PERMISSION-PROFILE=strict' \
            'INPUT_ISOLATION=docker' 'INPUT_MAX-CONTROLLER-STEPS=1'
          review_comments="$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR/comments?per_page=100")"
          echo "review_comment_ids=$(jq -c '[.[].id]' <<<"$review_comments")" >> "$GITHUB_OUTPUT"
          review_result="$(read_output review result-json)"
          jq -e '
            .termination.conclusion == "success" and .operation.kind == "review" and
            .publication.review.inlinePublished == 1 and .publication.review.summaryOnly == 0 and
            .publication.review.failures == []
          ' <<<"$review_result" >/dev/null
          jq -e --arg head "$CHECKS_HEAD" --arg path "$FIXTURE_PATH" \
            --arg marker "DSH E2E inline review $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" '
            length == 1 and .[0].user.id == 41898282 and .[0].commit_id == $head and
            .[0].path == $path and .[0].line == 1 and .[0].side == "RIGHT" and
            (.[0].body | contains($marker))
          ' <<<"$review_comments" >/dev/null
          gh api "repos/$REPOSITORY/issues/$CHECKS_PR/comments?per_page=100" \
            | jq -e --arg marker "DSH E2E review completed $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" '
                any(.[]; .user.id == 41898282 and (.body | contains($marker)))
              ' >/dev/null

          # Real failed-check context, one real DSH Bash call, Controller validation,
          # and an exact remote head/content read qualify the existing fix path.
          check_json="$(jq -cn --arg name "dsh-e2e-failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg head "$CHECKS_HEAD" --arg marker "DSH_E2E_CI_FAILURE_$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" '
            {name:$name,head_sha:$head,status:"completed",conclusion:"failure",
             output:{title:"Intentional isolated E2E failure",summary:$marker}}
          ' | gh api --method POST "repos/$REPOSITORY/check-runs" --input -)"
          echo "failure_check_id=$(jq -r .id <<<"$check_json")" >> "$GITHUB_OUTPUT"
          jq -e --arg head "$CHECKS_HEAD" '.head_sha == $head and .conclusion == "failure"' <<<"$check_json" >/dev/null
          expected_fix="DSH E2E fixed $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          validation="$(jq -cn --arg path "$FIXTURE_PATH" --arg content "$expected_fix" \
            '[["node",".github/dsh-e2e-fixtures/validate-business-file.mjs",$path,$content]]')"
          fix_ok=true
          run_candidate fix pull_request "$RUNNER_TEMP/dsh-e2e-checks-event.json" fix \
            'INPUT_COMMAND=fix' 'INPUT_ALLOW-WRITE=true' 'INPUT_PERMISSION-PROFILE=custom' \
            'INPUT_ALLOWED-TOOLS=["workspace.edit","native.bash"]' 'INPUT_ISOLATION=docker' 'INPUT_MAX-CONTROLLER-STEPS=1' \
            'INPUT_RUN-TESTS=true' 'INPUT_VALIDATION-INTEGRITY=strict' \
            "INPUT_TEST-COMMANDS=$validation" \
            'INPUT_CONTAINER-IMAGE=docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059' \
            || fix_ok=false
          fixed_head="$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR" --jq .head.sha)"
          echo "fixed_head=$fixed_head" >> "$GITHUB_OUTPUT"
          [[ "$fix_ok" == "true" ]]
          fix_result="$(read_output fix result-json)"
          jq -e --arg head "$fixed_head" --arg path "$FIXTURE_PATH" '
            .termination.conclusion == "success" and .operation.kind == "fix" and .publication.writeStatus == "success" and
            .publication.commitSha == $head and .publication.changedPaths == [$path] and
            .validation.status == "passed" and .validation.integrity.status == "clean" and
            ([.agent.dshToolReceipts[] | select(.id == "native.bash" and .completed and .ok)] | length == 1)
          ' <<<"$fix_result" >/dev/null
          FIXED_HEAD="$fixed_head" node .github/e2e/assert-business-effects.mjs fix

          # Reopen only the isolated Issue already bound by this job. The generated
          # implementation branch is predictable from the Controller operation key,
          # so an interrupted PR creation still leaves a precisely owned cleanup target.
          implementation_path="dsh-e2e-implementation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          implementation_key="$(node --input-type=module - "$REPOSITORY" "$ISSUE_NUMBER" "$GITHUB_RUN_ID" <<'NODE'
          import { createHash } from "node:crypto";
          const [repository, issue, run] = process.argv.slice(2);
          process.stdout.write(createHash("sha256").update([...repository.toLowerCase().split("/"), issue, run].join("\0")).digest("hex").slice(0, 24));
          NODE
          )"
          implementation_branch="dsh-e2e/implement-$ISSUE_NUMBER-$implementation_key"
          echo "implementation_branch=$implementation_branch" >> "$GITHUB_OUTPUT"
          echo "implementation_key=$implementation_key" >> "$GITHUB_OUTPUT"
          echo "implementation_path=$implementation_path" >> "$GITHUB_OUTPUT"
          gh api --method PATCH "repos/$REPOSITORY/issues/$ISSUE_NUMBER" -f state=open -f state_reason=reopened \
            > "$RUNNER_TEMP/dsh-e2e-implementation-issue.json"
          jq -n --slurpfile repository "$RUNNER_TEMP/dsh-e2e-integration-repository.json" \
            --slurpfile issue "$RUNNER_TEMP/dsh-e2e-implementation-issue.json" --arg actor "$actor" '
            {action:"opened",repository:$repository[0],sender:{login:$actor},issue:$issue[0]}
          ' > "$RUNNER_TEMP/dsh-e2e-implementation-event.json"
          expected_implementation="DSH E2E implemented $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          validation="$(jq -cn --arg path "$implementation_path" --arg content "$expected_implementation" \
            '[["node",".github/dsh-e2e-fixtures/validate-business-file.mjs",$path,$content]]')"
          implement_ok=true
          run_candidate implement issues "$RUNNER_TEMP/dsh-e2e-implementation-event.json" implement \
            'INPUT_COMMAND=implement' 'INPUT_ALLOW-WRITE=true' 'INPUT_PERMISSION-PROFILE=custom' \
            'INPUT_ALLOWED-TOOLS=["workspace.edit","native.bash"]' 'INPUT_ISOLATION=docker' 'INPUT_MAX-CONTROLLER-STEPS=1' \
            "INPUT_BASE-BRANCH=$CHECKS_BASE_BRANCH" 'INPUT_BRANCH-PREFIX=dsh-e2e/' \
            'INPUT_BRANCH-NAME-TEMPLATE={{prefix}}implement-{{entityNumber}}-{{key}}' \
            'INPUT_RUN-TESTS=true' 'INPUT_VALIDATION-INTEGRITY=strict' "INPUT_TEST-COMMANDS=$validation" \
            'INPUT_CONTAINER-IMAGE=docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059' \
            || implement_ok=false
          implementation_pulls="$(gh api --method GET "repos/$REPOSITORY/pulls" \
            -f head="${REPOSITORY%%/*}:$implementation_branch" -f base="$CHECKS_BASE_BRANCH" -f state=all -f per_page=100)"
          echo "implementation_pull_ids=$(jq -c '[.[] | {number,id,head:.head.sha}]' <<<"$implementation_pulls")" >> "$GITHUB_OUTPUT"
          [[ "$implement_ok" == "true" ]]
          implementation_result="$(read_output implement result-json)"
          jq -e --arg branch "$implementation_branch" --arg path "$implementation_path" '
            .termination.conclusion == "success" and .operation.kind == "implement" and
            .publication.writeStatus == "success" and .publication.branchName == $branch and
            (.publication.pullRequestNumber | type == "number") and
            .validation.status == "passed" and .validation.integrity.status == "clean" and
            ([.agent.dshToolReceipts[] | select(.id == "native.bash" and .completed and .ok)] | length == 1)
          ' <<<"$implementation_result" >/dev/null
          IMPLEMENTATION_BRANCH="$implementation_branch" IMPLEMENTATION_KEY="$implementation_key" \
            IMPLEMENTATION_PATH="$implementation_path" \
            IMPLEMENTATION_PULL_NUMBER="$(jq -r .publication.pullRequestNumber <<<"$implementation_result")" \
            node .github/e2e/assert-business-effects.mjs implement
          for business_result in "$review_result" "$fix_result" "$implementation_result"; do
            jq -c '{operation:.operation.kind,conclusion:.termination.conclusion,review:.publication.review,validation,publication:.publication,dshToolReceipts:.agent.dshToolReceipts}' <<<"$business_result"
          done

          fixture_hash="$(printf '%s' "$fixture_key" | sha256sum | cut -d' ' -f1)"
          for public_result in "$native_write_result" "$native_checks_result" "$review_result" "$fix_result" "$implementation_result"; do
            [[ "$public_result" != *"$fixture_key"* ]]
            [[ "$public_result" != *"$fixture_hash"* ]]
          done

          jq -s -e '
            ([.[] | select(.kind == "agent")] | length == 19) and
            all(.authorizationMatches == true) and
            ([.[] | select(.route == "label")] | length == 1) and
            ([.[] | select(.route == "assignee")] | length == 1) and
            ([.[] | select(.route == "github")] | length == 5) and
            ([.[] | select(.route == "metadata")] | length == 2) and
            ([.[] | select(.route == "checks")] | length == 2) and
            ([.[] | select(.route == "native-write" and .kind == "agent")] | length == 1) and
            ([.[] | select(.route == "native-checks" and .kind == "agent")] | length == 2) and
            ([.[] | select(.route == "review")] | length == 1) and
            ([.[] | select(.route == "fix") | .phase] == ["bash-issued","bash-observed"]) and
            ([.[] | select(.route == "implement") | .phase] == ["bash-issued","bash-observed"])
          ' "$audit" >/dev/null

      - name: Capture bounded business execution evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/dsh-e2e-github-audit.jsonl"
          evidence="$RUNNER_TEMP/dsh-e2e-business-evidence.json"
          if [[ -f "$audit" ]]; then
            jq -s '[.[] | select(.route == "review" or .route == "fix" or .route == "implement") |
              {route,index,kind,phase,authorizationMatches}]' "$audit" > "$evidence"
          else
            printf '[]\n' > "$evidence"
          fi
          cat "$evidence"

      - name: Preserve business execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: business-execution-evidence
          path: ${{ runner.temp }}/dsh-e2e-business-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove only verified integration fixtures
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
          ISSUE_LABEL: ${{ steps.integration_entities.outputs.label }}
          ISSUE_NUMBER: ${{ steps.integration_entities.outputs.issue_number }}
          ISSUE_ID: ${{ steps.integration_entities.outputs.issue_id }}
          CHECKS_BASE_BRANCH: ${{ steps.integration_entities.outputs.base_branch }}
          CHECKS_BASE_TREE: ${{ steps.integration_entities.outputs.base_tree_sha }}
          CHECKS_BASE_SHA: ${{ steps.integration_entities.outputs.base_sha }}
          CHECKS_BRANCH: ${{ steps.integration_entities.outputs.branch }}
          CHECKS_TREE: ${{ steps.integration_entities.outputs.tree_sha }}
          CHECKS_HEAD: ${{ steps.integration_entities.outputs.head_sha }}
          FIXTURE_PATH: ${{ steps.integration_entities.outputs.fixture_path }}
          CHECKS_PR: ${{ steps.integration_entities.outputs.pr_number }}
          CHECKS_PR_ID: ${{ steps.integration_entities.outputs.pr_id }}
          IMPLEMENTATION_BRANCH: ${{ steps.integration_contracts.outputs.implementation_branch }}
          IMPLEMENTATION_KEY: ${{ steps.integration_contracts.outputs.implementation_key }}
          IMPLEMENTATION_PATH: ${{ steps.integration_contracts.outputs.implementation_path }}
          FAILURE_CHECK_ID: ${{ steps.integration_contracts.outputs.failure_check_id }}
        run: |
          set +e
          set -uo pipefail
          cleanup_failures=0
          record_failure() {
            echo "::error::Integration cleanup failed for $1; no unverified or broad deletion was attempted."
            cleanup_failures=$((cleanup_failures + 1))
          }
          marker="<!-- dsh-e2e:github-integration:v1 run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT candidate=$CANDIDATE_SHA -->"
          issue_title="DSH E2E GitHub integration $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          issue_body="$(printf '%s\n\n%s' "$marker" "Temporary Issue owned by the trusted GitHub integration harness.")"
          pr_title="DSH E2E checks $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          mutated_pr_title="DSH E2E checks updated $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          pr_body="$(printf '%s\n\n%s' "$marker" "Temporary draft PR owned by the trusted GitHub integration harness.")"

          cleanup_issue() (
            set -euo pipefail
            [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
            [[ -z "$ISSUE_ID" || "$ISSUE_ID" =~ ^[1-9][0-9]*$ ]]
            issue_json="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER")"
            actual_issue_id="$(jq -r .id <<<"$issue_json")"
            [[ "$actual_issue_id" =~ ^[1-9][0-9]*$ ]]
            [[ -z "$ISSUE_ID" || "$ISSUE_ID" == "$actual_issue_id" ]]
            jq -e --argjson number "$ISSUE_NUMBER" --arg title "$issue_title" --arg body "$issue_body" '
              .number == $number and (has("pull_request") | not) and
              .user.id == 41898282 and .title == $title and .body == $body
            ' <<<"$issue_json" >/dev/null
            jq -cn '{state:"open",state_reason:"reopened",labels:[],assignees:[]}' \
              | gh api --method PATCH "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --input - >/dev/null
            issue_comments="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
            jq -e 'all(.[]; .user.id == 41898282)' <<<"$issue_comments" >/dev/null
            mapfile -t comment_ids < <(jq -r '.[].id' <<<"$issue_comments")
            for comment_id in "${comment_ids[@]}"; do
              [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
              gh api --method DELETE "repos/$REPOSITORY/issues/comments/$comment_id"
            done
            gh api --method PATCH "repos/$REPOSITORY/issues/$ISSUE_NUMBER" -f state=closed >/dev/null
            [[ "$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq .state)" == "closed" ]]
            [[ "$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq length)" -eq 0 ]]
          )

          cleanup_label() (
            set -euo pipefail
            [[ "$ISSUE_LABEL" =~ ^dsh-e2e-[1-9][0-9]*-[1-9][0-9]*$ ]]
            label_json="$(gh api "repos/$REPOSITORY/labels/$ISSUE_LABEL" 2>/dev/null)" || return 0
            label_description="Run-bound Core E2E fixture $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            jq -e --arg name "$ISSUE_LABEL" --arg description "$label_description" '
              .name == $name and .color == "5319e7" and .description == $description
            ' <<<"$label_json" >/dev/null
            gh api --method DELETE "repos/$REPOSITORY/labels/$ISSUE_LABEL"
          )

          cleanup_pull() (
            set -euo pipefail
            [[ "$CHECKS_PR" =~ ^[1-9][0-9]*$ ]]
            [[ -z "$CHECKS_PR_ID" || "$CHECKS_PR_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$CHECKS_BASE_BRANCH" =~ ^dsh-e2e/checks-base-[1-9][0-9]*-[1-9][0-9]*$ ]]
            [[ "$CHECKS_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$CHECKS_BRANCH" =~ ^dsh-e2e/checks-[1-9][0-9]*-[1-9][0-9]*$ ]]
            pr_json="$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR")"
            actual_pr_id="$(jq -r .id <<<"$pr_json")"
            expected_head="$CHECKS_HEAD"
            actual_head="$(jq -r .head.sha <<<"$pr_json")"
            if [[ -n "$expected_head" && "$actual_head" != "$expected_head" ]]; then
              FIXED_HEAD="$actual_head" node .github/e2e/assert-business-effects.mjs fix-cleanup
              expected_head="$actual_head"
            fi
            [[ "$actual_pr_id" =~ ^[1-9][0-9]*$ ]]
            [[ -z "$CHECKS_PR_ID" || "$CHECKS_PR_ID" == "$actual_pr_id" ]]
            if [[ -z "$expected_head" ]]; then expected_head="$(jq -r .head.sha <<<"$pr_json")"; fi
            [[ "$expected_head" =~ ^[a-f0-9]{40}$ ]]
            jq -e --argjson number "$CHECKS_PR" --arg repo "${REPOSITORY,,}" \
              --arg branch "$CHECKS_BRANCH" --arg base "$CHECKS_BASE_BRANCH" --arg sha "$expected_head" \
              --arg base_sha "$CHECKS_BASE_SHA" --arg title "$pr_title" --arg mutated "$mutated_pr_title" --arg body "$pr_body" '
              .number == $number and (.state == "open" or .state == "closed") and .draft == true and
              (.head.repo.full_name | ascii_downcase) == $repo and .head.ref == $branch and .head.sha == $sha and
              (.base.repo.full_name | ascii_downcase) == $repo and .base.ref == $base and .base.sha == $base_sha and
              (.title == $title or .title == $mutated) and .body == $body
            ' <<<"$pr_json" >/dev/null
            pr_comments="$(gh api "repos/$REPOSITORY/issues/$CHECKS_PR/comments?per_page=100")"
            jq -e 'all(.[]; .user.id == 41898282)' <<<"$pr_comments" >/dev/null
            mapfile -t comment_ids < <(jq -r '.[].id' <<<"$pr_comments")
            for comment_id in "${comment_ids[@]}"; do
              [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
              gh api --method DELETE "repos/$REPOSITORY/issues/comments/$comment_id"
            done
            review_comments="$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR/comments?per_page=100")"
            jq -e --arg head "$CHECKS_HEAD" --arg path "$FIXTURE_PATH" \
              --arg marker "DSH E2E inline review $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" '
              all(.[]; .user.id == 41898282 and .original_commit_id == $head and .path == $path and
                (.body | contains($marker)))
            ' <<<"$review_comments" >/dev/null
            mapfile -t review_ids < <(jq -r '.[].id' <<<"$review_comments")
            for review_id in "${review_ids[@]}"; do
              [[ "$review_id" =~ ^[1-9][0-9]*$ ]]
              gh api --method DELETE "repos/$REPOSITORY/pulls/comments/$review_id"
            done
            [[ "$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR/comments?per_page=100" --jq length)" -eq 0 ]]
            current_pull="$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR")"
            jq -e --argjson id "$actual_pr_id" --argjson number "$CHECKS_PR" --arg repo "${REPOSITORY,,}" \
              --arg branch "$CHECKS_BRANCH" --arg base "$CHECKS_BASE_BRANCH" --arg sha "$expected_head" \
              --arg base_sha "$CHECKS_BASE_SHA" --arg title "$pr_title" --arg mutated "$mutated_pr_title" --arg body "$pr_body" '
              .id == $id and .number == $number and (.state == "open" or .state == "closed") and .draft == true and
              (.head.repo.full_name | ascii_downcase) == $repo and .head.ref == $branch and .head.sha == $sha and
              (.base.repo.full_name | ascii_downcase) == $repo and .base.ref == $base and .base.sha == $base_sha and
              (.title == $title or .title == $mutated) and .body == $body
            ' <<<"$current_pull" >/dev/null
            gh api --method PATCH "repos/$REPOSITORY/pulls/$CHECKS_PR" -f title="$pr_title" -f state=closed >/dev/null
            [[ "$(gh api "repos/$REPOSITORY/pulls/$CHECKS_PR" --jq .state)" == "closed" ]]
          )

          cleanup_branch() (
            set -euo pipefail
            [[ "$CHECKS_BRANCH" =~ ^dsh-e2e/checks-[1-9][0-9]*-[1-9][0-9]*$ ]]
            [[ "$FIXTURE_PATH" =~ ^\.github/dsh-e2e-fixtures/checks-[1-9][0-9]*-[1-9][0-9]*\.txt$ ]]
            if ! ref_json="$(gh api "repos/$REPOSITORY/git/ref/heads/$CHECKS_BRANCH" 2>/dev/null)"; then
              jq -e '.status == "404" or .status == 404' <<<"$ref_json" >/dev/null && return 0
              echo "Fixture ref preflight could not confirm absence." >&2
              return 1
            fi
            ref_sha="$(jq -r .object.sha <<<"$ref_json")"
            [[ "$ref_sha" =~ ^[a-f0-9]{40}$ ]]
            if [[ -n "$CHECKS_HEAD" && "$ref_sha" != "$CHECKS_HEAD" ]]; then
              FIXED_HEAD="$ref_sha" node .github/e2e/assert-business-effects.mjs fix-cleanup
              node .github/e2e/fixture-ref.mjs delete "$CHECKS_BRANCH" "$ref_sha"
              return
            fi
            [[ -z "$CHECKS_HEAD" || "$ref_sha" == "$CHECKS_HEAD" ]]
            commit_json="$(gh api "repos/$REPOSITORY/git/commits/$ref_sha")"
            [[ "$(jq -r '.parents | length' <<<"$commit_json")" -eq 1 ]]
            [[ "$CHECKS_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$(jq -r '.parents[0].sha' <<<"$commit_json")" == "$CHECKS_BASE_SHA" ]]
            [[ "$CHECKS_TREE" =~ ^[a-f0-9]{40}$ && "$(jq -r .tree.sha <<<"$commit_json")" == "$CHECKS_TREE" ]]
            [[ "$(jq -r .message <<<"$commit_json")" == "DSH E2E checks fixture $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]
            compare_json="$(gh api "repos/$REPOSITORY/compare/$CHECKS_BASE_SHA...$ref_sha")"
            blob_sha="$(jq -r --arg path "$FIXTURE_PATH" '
              if (.files | length == 1) and .files[0].filename == $path and .files[0].status == "modified"
              then .files[0].sha else empty end
            ' <<<"$compare_json")"
            [[ "$blob_sha" =~ ^[a-f0-9]{40}$ ]]
            content="$(gh api "repos/$REPOSITORY/git/blobs/$blob_sha" --jq .content | tr -d '\n' | base64 --decode)"
            [[ "$content" == "DSH E2E checks head $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]
            node .github/e2e/fixture-ref.mjs delete "$CHECKS_BRANCH" "$ref_sha"
          )

          cleanup_base_branch() (
            set -euo pipefail
            [[ "$CHECKS_BASE_BRANCH" =~ ^dsh-e2e/checks-base-[1-9][0-9]*-[1-9][0-9]*$ ]]
            [[ "$FIXTURE_PATH" =~ ^\.github/dsh-e2e-fixtures/checks-[1-9][0-9]*-[1-9][0-9]*\.txt$ ]]
            if ! ref_json="$(gh api "repos/$REPOSITORY/git/ref/heads/$CHECKS_BASE_BRANCH" 2>/dev/null)"; then
              jq -e '.status == "404" or .status == 404' <<<"$ref_json" >/dev/null && return 0
              echo "Fixture ref preflight could not confirm absence." >&2
              return 1
            fi
            ref_sha="$(jq -r .object.sha <<<"$ref_json")"
            [[ "$ref_sha" =~ ^[a-f0-9]{40}$ ]]
            [[ -z "$CHECKS_BASE_SHA" || "$ref_sha" == "$CHECKS_BASE_SHA" ]]
            commit_json="$(gh api "repos/$REPOSITORY/git/commits/$ref_sha")"
            [[ "$(jq -r '.parents | length' <<<"$commit_json")" -eq 1 ]]
            [[ "$(jq -r '.parents[0].sha' <<<"$commit_json")" == "$CANDIDATE_SHA" ]]
            [[ "$CHECKS_BASE_TREE" =~ ^[a-f0-9]{40}$ && "$(jq -r .tree.sha <<<"$commit_json")" == "$CHECKS_BASE_TREE" ]]
            [[ "$(jq -r .message <<<"$commit_json")" == "DSH E2E checks base $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]
            tree_json="$(gh api "repos/$REPOSITORY/git/trees/$CHECKS_BASE_TREE?recursive=1")"
            validator_blob_sha="$(git hash-object .github/e2e/validate-business-file.mjs)"
            base_blob_sha="$(jq -r --arg path "$FIXTURE_PATH" --arg validator "$validator_blob_sha" '
              if .truncated == false and (.tree | length == 4) and
                ([.tree[] | select(.path == ".github" and .mode == "040000" and .type == "tree")] | length == 1) and
                ([.tree[] | select(.path == ".github/dsh-e2e-fixtures" and .mode == "040000" and .type == "tree")] | length == 1) and
                ([.tree[] | select(.path == ".github/dsh-e2e-fixtures/validate-business-file.mjs" and .mode == "100644" and .type == "blob" and .sha == $validator)] | length == 1) and
                ([.tree[] | select(.path == $path and .mode == "100644" and .type == "blob")] | length == 1)
              then (.tree[] | select(.path == $path)).sha else empty end
            ' <<<"$tree_json")"
            [[ "$base_blob_sha" =~ ^[a-f0-9]{40}$ ]]
            content="$(gh api "repos/$REPOSITORY/git/blobs/$base_blob_sha" --jq .content | tr -d '\n' | base64 --decode)"
            [[ "$content" == "DSH E2E checks base $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]
            node .github/e2e/fixture-ref.mjs delete "$CHECKS_BASE_BRANCH" "$ref_sha"
          )

          cleanup_failure_check() (
            set -euo pipefail
            [[ "$FAILURE_CHECK_ID" =~ ^[1-9][0-9]*$ ]]
            check_json="$(gh api "repos/$REPOSITORY/check-runs/$FAILURE_CHECK_ID")"
            jq -e --argjson id "$FAILURE_CHECK_ID" --arg head "$CHECKS_HEAD" \
              --arg name "dsh-e2e-failure-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '
              .id == $id and .head_sha == $head and .name == $name and
              .status == "completed" and (.conclusion == "failure" or .conclusion == "neutral")
            ' <<<"$check_json" >/dev/null
            gh api --method PATCH "repos/$REPOSITORY/check-runs/$FAILURE_CHECK_ID" \
              -f conclusion=neutral >/dev/null
            [[ "$(gh api "repos/$REPOSITORY/check-runs/$FAILURE_CHECK_ID" --jq .conclusion)" == "neutral" ]]
          )

          if [[ -n "$FAILURE_CHECK_ID" ]]; then
            cleanup_failure_check; status=$?; if [[ "$status" -ne 0 ]]; then record_failure failure-check; fi
          fi
          if [[ -n "$IMPLEMENTATION_BRANCH" ]]; then
            node .github/e2e/assert-business-effects.mjs cleanup-implement
            status=$?; if [[ "$status" -ne 0 ]]; then record_failure implementation; fi
          fi
          if [[ -n "$ISSUE_NUMBER" || -n "$ISSUE_ID" ]]; then
            cleanup_issue; status=$?; if [[ "$status" -ne 0 ]]; then record_failure issue; fi
          fi
          if [[ -n "$ISSUE_LABEL" ]]; then
            cleanup_label; status=$?; if [[ "$status" -ne 0 ]]; then record_failure label; fi
          fi
          if [[ -n "$CHECKS_PR" || -n "$CHECKS_PR_ID" ]]; then
            cleanup_pull; status=$?; if [[ "$status" -ne 0 ]]; then record_failure pull-request; fi
          fi
          if [[ -n "$CHECKS_BRANCH" || -n "$CHECKS_HEAD" || -n "$FIXTURE_PATH" ]]; then
            cleanup_branch; status=$?; if [[ "$status" -ne 0 ]]; then record_failure branch; fi
          fi
          if [[ -n "$CHECKS_BASE_BRANCH" || -n "$CHECKS_BASE_SHA" || -n "$FIXTURE_PATH" ]]; then
            cleanup_base_branch; status=$?; if [[ "$status" -ne 0 ]]; then record_failure base-branch; fi
          fi

          bash .github/e2e/assert-candidate-binding.sh || record_failure candidate-binding
          ! git -C . config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1 || record_failure harness-credentials
          ! git -C candidate-action config --local --get-regexp '^(http\..*\.extraheader|credential\.)' >/dev/null 2>&1 || record_failure candidate-credentials
          [[ "$cleanup_failures" -eq 0 ]]

  revalidate_candidate:
    name: Final candidate binding
    needs: [gate, read_only, write, cancellation, integration]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Revalidate exact candidate binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_MODE: ${{ needs.gate.outputs.candidate_mode }}
          CANDIDATE_SHA: ${{ needs.gate.outputs.candidate_sha }}
          CANDIDATE_PR: ${{ needs.gate.outputs.pull_request }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_MODE" in
            pull-request)
              pr_json="$(gh api "repos/$REPOSITORY/pulls/$CANDIDATE_PR")"
              jq -e --arg sha "$CANDIDATE_SHA" --arg repo "${REPOSITORY,,}" --arg base "$DEFAULT_BRANCH" '
                .state == "open" and .draft == false and .head.sha == $sha and
                (.head.repo.full_name | ascii_downcase) == $repo and
                (.base.repo.full_name | ascii_downcase) == $repo and .base.ref == $base
              ' <<<"$pr_json" >/dev/null
              ;;
            main)
              [[ -z "$CANDIDATE_PR" ]]
              [[ "$(gh api "repos/$REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)" == "$CANDIDATE_SHA" ]]
              ;;
            *) exit 1 ;;
          esac
