name: "DeepSeek Harness for GitHub"
description: "DeepSeek coding tasks with controlled and native DSH composition, ecosystem extensions, and GitHub automation"
author: "Lixiaoyiao"
branding:
  icon: "code"
  color: "blue"

inputs:
  # BEGIN GENERATED ACTION INPUTS
  deepseek-api-key:
    description: "DeepSeek API key. Kept by the controller-side credential proxy; never passed to DSH or repository code."
    required: true
  github-token:
    description: "GitHub token used only by the trusted controller."
    required: false
    default: "${{ github.token }}"
  allow-write:
    description: "Allow trusted same-repository task/fix/implement writes after all trust gates pass."
    required: false
    default: "false"
  command:
    description: "Optional explicit operation: task, review, diagnose, fix, implement, or auto."
    required: false
    default: "auto"
  task-access:
    description: "Capability requested by an explicit task: read or write. Write still requires allow-write and every policy gate."
    required: false
    default: "read"
  prompt:
    description: "Trusted task prompt. With command=auto on dispatch/schedule events, a non-empty prompt selects generic task mode."
    required: false
    default: ""
  prompt-file:
    description: "Explicit maintainer-selected UTF-8 task file from the repository default branch, pinned to its resolved commit SHA. Mutually exclusive with prompt; interactive command instructions keep precedence. Text only."
    required: false
    default: ""
  context-files:
    description: "JSON array of at most 8 explicit repository-relative text paths from the bound task revision. Attached as untrusted context, never authority; no globs, symlinks, runner paths, images, or Office files."
    required: false
    default: "[]"
  session-mode:
    description: "Session opt-in: off, auto, save, or resume. Auto creates or continues the latest successful compatible checkpoint by key, with verified key-scoped concurrency and run-name history. Requires Docker; explicit save/resume remain supported."
    required: false
    default: "off"
  session-key:
    description: "Maintainer-selected logical Session key, 1-64 ASCII letters, digits, dot, underscore or hyphen. Auto keys are case-insensitive, matching GitHub concurrency. Bound to repository, workflow job, task and runtime; never grants authority."
    required: false
    default: ""
  session-source-run-id:
    description: "For session-mode=resume, the explicit successful producer Actions run ID. Only its verified current attempt and latest compatible checkpoint may be restored."
    required: false
    default: ""
  session-retention-days:
    description: "Checkpoint retention, 1-7 days. Only the complete raw DSH Session and a bounded provenance manifest are saved; credentials and Controller authorization are excluded."
    required: false
    default: "3"
  trigger-phrase:
    description: "Maintainer-controlled literal used for first-line comment commands. Routing only; it never grants authority."
    required: false
    default: "@dsh"
  label-trigger:
    description: "Optional exact label that routes Issue tasks or pull request reviews. Empty disables this route."
    required: false
    default: ""
  assignee-trigger:
    description: "Optional exact assignee login that routes Issue tasks or pull request reviews. Empty disables this route."
    required: false
    default: ""
  allowed-actors:
    description: "Comma-separated maintainer routing allowlist for originating actors. * preserves the default route; authorization remains separate."
    required: false
    default: "*"
  allowed-bots:
    description: "Comma-separated bot allowlist. Empty preserves the fail-closed bot write gate; listed bots still need repository write permission."
    required: false
    default: ""
  include-comments-by-actor:
    description: "Optional comma-separated allowlist for historical comments included as untrusted context. The audited trigger comment is retained."
    required: false
    default: ""
  exclude-comments-by-actor:
    description: "Optional comma-separated deny list for historical comment context. Exclusion wins over inclusion."
    required: false
    default: ""
  base-branch:
    description: "Maintainer-selected base branch for Issue and automation tasks. Empty uses the trusted repository default branch; PR fixes stay bound to their head."
    required: false
    default: ""
  branch-prefix:
    description: "Validated prefix for Controller-created task branches."
    required: false
    default: "dsh/"
  branch-name-template:
    description: "Optional deterministic branch template using {{prefix}}, {{key}}, {{operation}}, {{entityType}}, and {{entityNumber}}; {{prefix}} and {{key}} are required."
    required: false
    default: ""
  task-output-schema:
    description: "Optional bounded maintainer-owned JSON Schema for a Controller-validated final taskOutput. Strict envelope validation still applies; it never replaces result-json or grants authority."
    required: false
    default: ""
  dsh-mode:
    description: "DSH composition ownership: controlled preserves the Controller-owned ToolRuntime policy; experimental native uses the official DSH headless Profile, MCP, Bundle, Plugin, Skill, Subagent, and Workflow graph inside the Action's Docker safety boundary."
    required: false
    default: "controlled"
  dsh-version:
    description: "Pinned @deepseek-ai/dsh version. The Action accepts only the audited 0.2.1-rc.2 runtime."
    required: false
    default: "0.2.1-rc.2"
  dsh-executable:
    description: "Trusted capability input. Optional absolute path to a preinstalled DSH executable; host mode executes it without a container boundary."
    required: false
    default: ""
  isolation:
    description: "Trusted capability input selecting the DSH isolation backend. 'none' removes the OS/container boundary; Docker is required for untrusted review data, writes, and extensions."
    required: false
    default: "docker"
  container-image:
    description: "Trusted worker-code input. Every value must be one Docker/OCI image reference and cannot be parsed as a Docker option; extensions and writes require a full name@sha256 digest."
    required: false
    default: "docker.io/library/node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059"
  timeout-minutes:
    description: "Overall setup/execution deadline shared by runtime and extension install, DSH turns, command tools, and validation. Fixed short cleanup/finalization grace may run after it."
    required: false
    default: "20"
  max-findings:
    description: "Maximum high-confidence findings to publish."
    required: false
    default: "20"
  run-tests:
    description: "Must be true for every code, Git ref, and pull-request mutation. false denies the mutation and is not a validation waiver."
    required: false
    default: "true"
  test-commands:
    description: 'Non-empty JSON array of credential-free argv arrays required for every write, e.g. [["npm","test"]]. Every command must pass; Controller credentials in argv are rejected.'
    required: false
    default: "[]"
  validation-integrity:
    description: "Controller-owned validation-definition policy: off records, warn reports, strict blocks high-confidence weakening and replays baseline controls when needed."
    required: false
    default: "warn"
  base-url:
    description: "Trusted credential-routing input for model requests and DeepSeek Search/Fetch APIs. Never derive it from untrusted content."
    required: false
    default: "https://api.deepseek.com"
  web-search-base-url:
    description: "An explicit custom URL preserves legacy Messages search. The default uses the new DeepSeek Search API through base-url; Fetch also uses base-url."
    required: false
    default: "https://api.deepseek.com/anthropic/v1"
  bot-user-id:
    description: "Numeric ID of the bot account that owns tracking comments. Defaults to github-actions[bot]."
    required: false
    default: "41898282"
  progress-comment:
    description: "Create or update one controller-owned sticky comment at major lifecycle stages, reusing the operation's result marker."
    required: false
    default: "true"
  max-turns:
    description: "Maximum fresh DSH turns across tool requests and validation repair attempts."
    required: false
    default: "3"
  permission-profile:
    description: "Agent tool preset: strict preserves v0.4 behavior, standard grants trusted coding conveniences, and custom uses the exact allow/deny lists."
    required: false
    default: "strict"
  allowed-tools:
    description: "JSON allowlist of Action/controlled capabilities. controlled accepts workspace.*, native.*, command.*, typed github.*, mcp.*, and plugin.* IDs; native rejects mcp./plugin. grants because DSH owns that inventory."
    required: false
    default: "[]"
  disallowed-tools:
    description: "JSON deny list using the same exact tool IDs as allowed-tools. Deny always wins after preset expansion."
    required: false
    default: "[]"
  tool-config:
    description: "Versioned JSON manifest of maintainer-owned fixed-argv command tools. Model-provided argv and controller credentials in argv are rejected; common direct shell executables are also denied."
    required: false
    default: '{"schemaVersion":1,"commands":[]}'
  mcp-config:
    description: "Versioned maintainer-owned official DSH MCP config. controlled declares exact tools/budgets; native declares the server, owner-level workspaceWrite/network, toolCallTimeoutMs, and explicit credentialEnv/credentialHeaders because DSH discovers tools."
    required: false
    default: '{"schemaVersion":1,"servers":[]}'
  plugin-config:
    description: "Versioned maintainer-owned DSH Bundle/Plugin config. Native entries are definition-only, with direct-Plugin credentialConfig, and load through official Profile/Cordis composition. Startup executes trusted worker code; every package requires an exact semver or GitHub commit pin."
    required: false
    default: '{"schemaVersion":1,"bundles":[],"plugins":[]}'
  allow-plugin-install:
    description: "Allow startup of explicitly configured and pinned third-party DSH Bundles/Plugins. Disabled by default because installation and startup execute trusted code."
    required: false
    default: "false"
  # END GENERATED ACTION INPUTS
outputs:
  dsh-mode:
    description: "Resolved DSH mode: controlled, native, or none"
  dsh-composition:
    description: "Stable selected DSH composition identity, or none"
  conclusion:
    description: "success, neutral, or failure"
  operation:
    description: "Resolved operation: task, review, diagnose, fix, implement, or none"
  summary:
    description: "Validated final summary for any operation, or a safe failure summary"
  review-summary:
    description: "Backward-compatible alias of summary"
  findings-count:
    description: "Selected review findings, or validated agent findings for other operations"
  branch-name:
    description: "Created or updated Controller task branch"
  pull-request-url:
    description: "Created pull request URL"
  commit-sha:
    description: "Commit created by a successful fix operation"
  trust:
    description: "Resolved execution profile: untrusted, trusted-read, trusted-write, or none"
  permission-profile:
    description: "Resolved Agent permission profile: strict, standard, custom, or none"
  effective-tools:
    description: "Backward-compatible Controller-plane canonical capability array. It is exact for controlled mode but never describes native DSH inventory; use result-json.toolPolicy.observedTools for native telemetry."
  network-access:
    description: "Effective worker network: host-gateway, mediated-web, bridge, or none before permission resolution"
  workspace-write:
    description: "Whether the effective Agent tools can modify the disposable workspace"
  trusted-extensions:
    description: "JSON array of Action-admitted MCP, Bundle, and Plugin owners; native network/write values describe shared worker authority, not per-tool grants"
  duration-ms:
    description: "Total controller duration in milliseconds"
  comment-id:
    description: "Sticky progress/result comment ID when progress tracking was available"
  error-code:
    description: "Stable failure code, empty on success or neutral completion"
  error-message:
    description: "Redacted and bounded failure message"
  extension-profile-digest:
    description: "SHA-256 digest of the redacted controlled extension profile or native admission audit, empty when unavailable"
  tool-receipts:
    description: "JSON object with bounded controller/DSH receipt arrays and truncation metadata; never an authorization input"
  task-output:
    description: "JSON-encoded maintainer-defined task output after Controller schema validation; empty when not configured or unavailable"
  result-json:
    description: "Versioned JSON envelope containing status, result, policy, permissions, tool-policy ownership audit, known-authority audit, extension audit, tool receipts, timing, publication, validation integrity, write, and error details"

runs:
  using: "node24"
  main: "dist/index.js"
